<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rep Ledger">
<meta name="theme-color" content="#111315">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Rep Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-handed gym tool. Dark graphite "plate" surfaces, signal-orange for the next action, bottom tab bar. */
:root{
  --bg:#111315;
  --surface:#1b1e22;
  --raised:#252a30;
  --line:#323840;
  --text:#eef0f2;
  --muted:#98a1ab;
  --accent:#ff7a33;
  --accent-ink:#1a0d05;
  --good:#3ccf8e;
  --warn:#f4c84a;
  --bad:#ff5d5d;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 140px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px}
.top .grow{flex:1;min-width:0}
.back{background:var(--raised);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:20px;flex:none}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.pill.pr{background:rgba(255,122,51,.15);color:var(--accent);border-color:rgba(255,122,51,.4)}
.pill.ok{color:var(--good);border-color:rgba(60,207,142,.4)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}.dot.wait{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.hot{border-color:rgba(255,122,51,.55);box-shadow:inset 3px 0 0 var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.gbtn b{font-family:var(--display);font-size:24px;font-weight:700}
.gbtn span{color:var(--muted);font-size:13px}
.gbtn:active,.row:active{background:var(--raised)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.chev{color:var(--muted)}
.sect{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -6px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,93,93,.4);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.q{display:flex;flex-direction:column;gap:8px}
.q label,.lbl{font-weight:600;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:9px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted);background:var(--raised);border-radius:8px;padding:8px 10px;border-left:3px solid var(--accent)}
input[type=text],input[type=number],input[type=search],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:90px;resize:vertical}
.sets{display:flex;flex-direction:column;gap:8px}
.sethead,.set{display:grid;grid-template-columns:28px 1fr 1fr 46px 34px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.set .n{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.set input{text-align:center;font-size:18px;font-weight:600;padding:8px}
.set input::placeholder{color:#5d6670;font-weight:500}
.tick{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:20px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#04140c}
.x{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:18px}
.set.done input{border-color:rgba(60,207,142,.5)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}.rgrid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}.rgrid input{min-height:38px;padding:6px;text-align:center}
.set input.low{border-color:var(--warn)}.set input.top{border-color:var(--good)}
.coach{display:flex;flex-direction:column;gap:4px}.coach b{font-family:var(--display);font-size:18px}
.bar{height:10px;background:var(--raised);border-radius:99px;overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.daychips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.daychips .chip{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;border-radius:12px}.daychips small{font-size:11px;font-weight:600;opacity:.75;line-height:1.1}
.guide{gap:12px}.guide h2{font-size:26px}.guide.live{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}.guide.done{border-color:var(--good)}
.bigclock{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--good)}
.btn.big{min-height:58px;font-size:18px}
.set.activeset{background:rgba(60,207,142,.08);border-radius:10px;outline:1px solid rgba(60,207,142,.5)}
.timer .tl{display:flex;flex-direction:column;flex:1;min-width:0}.timer .tl .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.live{border-color:var(--good)}
.gwrap{display:flex;justify-content:center}.gauge{width:min(300px,100%);height:auto}
.meter{display:flex;flex-direction:column;gap:4px}.mrow{display:flex;justify-content:space-between;gap:8px;font-size:14px}.mrow span:first-child{font-weight:600}
.ins{font-size:14px;padding:9px 11px;border-radius:8px;background:var(--raised);border-left:3px solid var(--muted)}.ins.bad{border-left-color:var(--bad)}.ins.warn{border-left-color:var(--warn)}.ins.info{border-left-color:#4aa8ff}
nav button{font-size:12px}
.reader{width:100%;min-height:220px;background:#000;border-radius:12px;overflow:hidden}.reader video{width:100%!important;height:auto!important;display:block}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}.fold summary{list-style:none;cursor:pointer;padding:14px;font-family:var(--display);font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.fold summary::-webkit-details-marker{display:none}.fold[open] summary .chev{transform:rotate(180deg)}.fold .chev{font-size:22px;transition:transform .15s}.foldbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--raised);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text)}
.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px 12px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(17,19,21,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:12px 4px 14px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:6;background:var(--raised);border:1px solid var(--accent);border-radius:14px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);width:min(608px,calc(100% - 32px))}
.timer .tv{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05}
.timer.end{border-color:var(--good)}
.timer .btn{min-height:38px;padding:6px 12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 16px 24px;width:100%;max-width:640px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--good);color:#04140c;font-weight:600;padding:10px 16px;border-radius:10px;z-index:20}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tick{transition:background .12s,border-color .12s}}
@media (max-width:380px){.sethead,.set{grid-template-columns:22px 1fr 1fr 42px 28px;gap:6px}.tick{width:42px;height:42px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="timerSlot"></div>
<nav aria-label="Main"><div class="in" id="nav"></div></nav>
<div id="overlaySlot"></div>

<script>
"use strict";
/* ============================================================
   EXERCISE LIBRARY  (tailored to typical Planet Fitness gear)
   choice: [value, label, pfNote?, flags?]   flags: {bw, assist}
   option.when: {otherKey:[values]} -> only asked when matched
   ============================================================ */
const GROUPS=[
  {id:"chest",name:"Chest",blurb:"Press, fly, push-ups"},
  {id:"back",name:"Back",blurb:"Pulldowns, rows, deadlifts"},
  {id:"shoulders",name:"Shoulders",blurb:"Press, raises, rear delts"},
  {id:"arms",name:"Arms",blurb:"Biceps, triceps, forearms"},
  {id:"legs",name:"Legs & Glutes",blurb:"Squat, press, curls, calves"},
  {id:"core",name:"Core",blurb:"Abs, obliques, planks"}
];
const ANGLE={key:"angle",label:"Bench angle",choices:[["flat","Flat"],["incline","Incline"],["decline","Decline"]]};
const SMITH=["smith","Smith Machine","Smith Machine. Bar weight differs by model, so log the plates you load and stay consistent."];
const DB=["db","Dumbbells","Dumbbell rack"];
const BB=["bb","Barbell","Free barbell + plates"];
const SEATSTAND={key:"pos",label:"Position",choices:[["seated","Seated"],["standing","Standing"]]};
const EX=[
// CHEST
{id:"bench",n:"Bench Press",g:"chest",pf:"Smith Machine or dumbbells with an adjustable bench",o:[
  {key:"equip",label:"Equipment",choices:[["bb","Barbell","Free barbell bench. Log total weight including the 45 lb bar."],[...SMITH.slice(0,2),"Smith Machine with an adjustable bench rolled underneath. Log the plates you load."],["db","Dumbbells","Dumbbell rack + adjustable bench. Log the weight of one dumbbell."]]},ANGLE]},
{id:"chestpress",n:"Chest Press Machine",g:"chest",o:[
  {key:"type",label:"Which machine",choices:[["seated","Chest Press","Pin-loaded \"Chest Press\" machine"],["incline","Incline Chest Press","Incline press machine (pin or plate-loaded, varies by club)"],["plate","Plate-loaded Press","Plate-loaded lever press, where available"]]}]},
{id:"fly",n:"Chest Fly",g:"chest",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Pec Fly machine","\"Pec Fly / Rear Delt\" machine. Sit facing away from the pad."],["cable","Cable Crossover","Dual adjustable pulley / cable crossover station"],["db","Dumbbells","Dumbbells on a bench"]]},
  {key:"height",label:"Pulley height",when:{equip:["cable"]},choices:[["high","High to low"],["mid","Chest height"],["low","Low to high"]]},
  {...ANGLE,when:{equip:["db"]}}]},
{id:"pushup",n:"Push-Ups",g:"chest",bw:true,pf:"Bodyweight. Add a plate on your back for extra load.",o:[
  {key:"style",label:"Style",choices:[["std","Standard"],["incline","Incline (hands on bench)"],["decline","Decline (feet on bench)"]]}]},
{id:"dipchest",n:"Chest Dips",g:"chest",o:[
  {key:"equip",label:"Equipment",choices:[["assist","Assisted Dip machine","Assisted Dip/Chin machine. Log the assist weight: lower means stronger.",{assist:true}],["bw","Bodyweight dips","Dip handles on the assisted machine",{bw:true}]]}]},
// BACK
{id:"pulldown",n:"Lat Pulldown",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Lat Pulldown machine","Pin-loaded \"Lat Pulldown\" with knee pad"],["cable","Cable station","Cable crossover, high pulley, kneeling or seated"]]},
  {key:"grip",label:"Grip",choices:[["wide","Wide overhand"],["close","Close / V-handle"],["under","Underhand"],["neutral","Neutral"]]}]},
{id:"row",n:"Seated Row",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Seated Row machine","Pin-loaded \"Seated Row\" with chest pad"],["cable","Low cable row","Cable station, low pulley"],["plate","Plate-loaded row","Plate-loaded row, where available"]]},
  {key:"grip",label:"Grip",choices:[["neutral","Neutral"],["wide","Wide overhand"],["under","Underhand"]]}]},
{id:"dbrow",n:"Dumbbell Row",g:"back",pf:"Dumbbells + bench",o:[
  {key:"style",label:"Style",choices:[["single","Single-arm on flat bench"],["chest","Chest-supported (incline bench)"]]}]},
{id:"bentrow",n:"Bent-Over Row",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[SMITH,DB,BB]},
  {key:"grip",label:"Grip",choices:[["over","Overhand"],["under","Underhand"]]}]},
{id:"pullup",n:"Pull-Up / Chin-Up",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[["assist","Assisted Chin machine","Assisted Dip/Chin machine. Log the assist weight: lower means stronger.",{assist:true}],["bw","Bodyweight","Pull-up bar on the assisted machine",{bw:true}]]},
  {key:"grip",label:"Grip",choices:[["pull","Pull-up (overhand)"],["chin","Chin-up (underhand)"],["neutral","Neutral"]]}]},
{id:"backext",n:"Back Extension",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Back Extension machine","Pin-loaded seated \"Back Extension\""],["bench","45° hyperextension","Roman chair. Hold a plate or dumbbell for load.",{bw:true}]]}]},
{id:"deadlift",n:"Deadlift",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[SMITH,DB,BB,["kb","Kettlebell","Kettlebells in the functional / PF 360 area"]]}]},
{id:"shrug",n:"Shrugs",g:"back",o:[{key:"equip",label:"Equipment",choices:[DB,SMITH,BB]}]},
// SHOULDERS
{id:"spress",n:"Shoulder Press",g:"shoulders",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Shoulder Press machine","Pin-loaded \"Shoulder Press\""],["smith","Smith Machine","Smith + bench set upright"],DB,BB]},
  {...SEATSTAND,when:{equip:["db","bb"]}}]},
{id:"lateral",n:"Lateral Raise",g:"shoulders",o:[
  {key:"equip",label:"Equipment",choices:[DB,["cable","Cable","Single-arm, low pulley"],["machine","Lateral Raise machine","Where available"]]}]},
{id:"front",n:"Front Raise",g:"shoulders",o:[
  {key:"equip",label:"Equipment",choices:[DB,["cable","Cable","Low pulley, rope or bar"],["plate","Plate","Single weight plate"]]}]},
{id:"reardelt",n:"Rear Delt Fly",g:"shoulders",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Rear Delt machine","\"Pec Fly / Rear Delt\" machine. Face the pad."],["db","Dumbbells","Bent-over or chest on incline bench"],["cable","Cable","Reverse fly on cable crossover"]]}]},
{id:"facepull",n:"Face Pull",g:"shoulders",pf:"Cable crossover with rope at face height",o:[]},
{id:"uprow",n:"Upright Row",g:"shoulders",o:[
  {key:"equip",label:"Equipment",choices:[SMITH,DB,["cable","Cable","Low pulley, straight bar"],["ez","EZ / curl bar"]]}]},
{id:"arnold",n:"Arnold Press",g:"shoulders",pf:"Dumbbells, seated on upright bench",o:[]},
// ARMS
{id:"curl",n:"Biceps Curl",g:"arms",sub:"Biceps",o:[
  {key:"equip",label:"Equipment",choices:[DB,["bar","Curl bar / EZ bar","Fixed-weight curl bars or EZ bar, where available"],["cable","Cable","Low pulley, bar or handles"],["machine","Biceps Curl machine","Pin-loaded \"Biceps Curl\" machine"]]},
  {key:"style",label:"Style",when:{equip:["db"]},choices:[["alt","Alternating"],["both","Both arms together"],["incline","Seated on incline bench"]]}]},
{id:"hammer",n:"Hammer Curl",g:"arms",sub:"Biceps",o:[
  {key:"equip",label:"Equipment",choices:[DB,["cable","Cable rope","Low pulley with rope"]]}]},
{id:"preacher",n:"Preacher Curl",g:"arms",sub:"Biceps",o:[
  {key:"equip",label:"Machine or bench",choices:[["machine","Machine","Pin-loaded \"Biceps Curl\" with preacher-style arm pad"],["bench","Preacher bench","Preacher curl bench, where available"]]},
  {key:"weight",label:"What are you holding",when:{equip:["bench"]},choices:[["db","Dumbbell (one arm)"],["ez","EZ bar"],["bb","Straight bar"]]}]},
{id:"concentration",n:"Concentration Curl",g:"arms",sub:"Biceps",pf:"Single dumbbell, seated on bench",o:[]},
{id:"pushdown",n:"Triceps Pushdown",g:"arms",sub:"Triceps",o:[
  {key:"equip",label:"Equipment",choices:[["cable","Cable station","Cable crossover / functional trainer, high pulley"],["machine","Triceps Press machine","Pin-loaded \"Triceps Press\" (seated dip-style)"]]},
  {key:"attach",label:"Attachment",when:{equip:["cable"]},choices:[["rope","Rope"],["bar","Straight bar"],["v","V-bar"],["single","Single-arm handle"]]}]},
{id:"ohext",n:"Overhead Triceps Extension",g:"arms",sub:"Triceps",o:[
  {key:"equip",label:"Equipment",choices:[["db","Dumbbell","One dumbbell, both hands"],["cable","Cable rope","Rope, facing away from the pulley"],["machine","Triceps Extension machine","Pin-loaded \"Triceps Extension\""]]},
  {...SEATSTAND,when:{equip:["db"]}}]},
{id:"skull",n:"Skull Crushers",g:"arms",sub:"Triceps",o:[
  {key:"equip",label:"Equipment",choices:[["ez","EZ / curl bar"],DB,SMITH]},ANGLE]},
{id:"cgbench",n:"Close-Grip Bench Press",g:"arms",sub:"Triceps",o:[{key:"equip",label:"Equipment",choices:[SMITH,DB,BB]}]},
{id:"dipstri",n:"Triceps Dips",g:"arms",sub:"Triceps",o:[
  {key:"equip",label:"Equipment",choices:[["assist","Assisted Dip machine","Log the assist weight: lower means stronger.",{assist:true}],["bench","Bench dips","Hands on a flat bench",{bw:true}],["bw","Dip station","Bodyweight on dip handles",{bw:true}]]}]},
{id:"kickback",n:"Triceps Kickback",g:"arms",sub:"Triceps",o:[{key:"equip",label:"Equipment",choices:[DB,["cable","Cable","Low pulley, single handle"]]}]},
{id:"wristcurl",n:"Wrist Curls",g:"arms",sub:"Forearms",pf:"Dumbbells over a flat bench",o:[
  {key:"style",label:"Grip",choices:[["up","Palms up"],["down","Palms down (reverse)"]]}]},
// LEGS
{id:"legpress",n:"Leg Press",g:"legs",o:[
  {key:"equip",label:"Machine",choices:[["machine","Seated Leg Press","Pin-loaded seated \"Leg Press\""],["plate","45° Leg Press sled","Plate-loaded sled, where available"]]},

function defaultRoutines(pid){const P=PROGRAMS.find(x=>x.id===(pid||S.settings.program))||PROGRAMS[0];
  return P.days.map(r=>({id:r.id,name:r.name,items:r.items.map(([exId,opts,sets,lo,hi,rest,tip,x])=>({exId,opts,sets,lo,hi,rest,tip:tip||"",add:(x&&x.add)||0,p2:!!(x&&x.p2)}))}));}
function migrate3(){
  if(S.settings.v3)return false;S.settings.v3=true;
  if(S.settings.program!=="ul"||!S.routines)return true;
  const same=(it,exId,opts)=>it.exId===exId&&JSON.stringify(it.opts)===JSON.stringify(opts);
  UL.forEach(d=>{const r=S.routines.find(x=>x.id===d.id);if(!r)return;
    d.items.forEach((t,k)=>{const x=t[7];if(!x)return;const it=r.items.find(i=>same(i,t[0],t[1]));
      if(it){if(x.add)it.add=x.add;if(x.p2)it.p2=true;}
      else if(x.p2){const at=Math.min(k,r.items.length);r.items.splice(at,0,{exId:t[0],opts:t[1],sets:t[2],lo:t[3],hi:t[4],rest:t[5],tip:t[6]||"",add:0,p2:true});}});});
  return true;
}
function migrate(){
  const m3=()=>migrate3();
  if(S.settings.program)return m3();
  const wasDefault=!S.routines||JSON.stringify(S.routines.map(r=>({id:r.id,items:r.items.map(i=>[i.exId,i.opts,i.sets,i.lo,i.hi,i.rest])})))===JSON.stringify(SPLIT.map(r=>({id:r.id,items:r.items.map(i=>i.slice(0,6))})));
  if(wasDefault){S.settings.program="ul";S.routines=defaultRoutines("ul");}else S.settings.program="split";
  m3();return true;
}

const LS_KEY="repledger.v1";

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);S={...S,...d,settings:{...S.settings,...(d.settings||{})}};}}catch(e){}
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}

function queueWrite(key,ref,fn){
  Cloud.chains[key]=(Cloud.chains[key]||Promise.resolve()).then(()=>fn(ref)).then(()=>{if(Cloud.status!=="local")setStatus("synced");}).catch(err=>{
    if(err&&err.code==="quota_exceeded"){toast("Cloud storage is full. Your data is still saved on this device.");}
    else if(err&&err.code==="unavailable"){return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>fn(ref)).catch(()=>setStatus("offline"));}
    else setStatus("offline");
  });
}
function debounced(key,ms,fn){clearTimeout(Cloud.timers[key]);Cloud.timers[key]=setTimeout(fn,ms);}
function profileBody(){return{settings:S.settings,custom:S.custom,lastOpts:S.lastOpts,routines:S.routines,bw:S.bw,customFoods:S.customFoods,recentFoods:(S.recentFoods||[]).slice(0,30),deleted:S.deleted.slice(-500),updatedAt:S.profileAt};}
function saveProfile(){
  S.profileAt=Date.now();saveLocal();
  if(Cloud.profile)debounced("profile",1200,()=>queueWrite("profile",Cloud.profile,r=>r.set(profileBody())));
}
function saveDraft(){
  S.draftAt=Date.now();saveLocal();
  if(Cloud.draft)debounced("draft",2000,()=>queueWrite("draft",Cloud.draft,r=>r.set({draft:S.draft,updatedAt:S.draftAt})));
}
function saveWorkout(w){
  S.workouts=S.workouts.filter(x=>x.id!==w.id);S.workouts.push(w);saveLocal();
  if(Cloud.workouts){const ref=Cloud.workouts.doc(w.id);queueWrite("w_"+w.id,ref,r=>r.set(w));}
}
function deleteWorkout(id){
  S.workouts=S.workouts.filter(x=>x.id!==id);S.deleted.push(id);saveProfile();
  if(Cloud.workouts){const ref=Cloud.workouts.doc(id);queueWrite("w_"+id,ref,r=>r.delete());}
}
function setStatus(s){Cloud.status=s;const el=document.getElementById("syncStatus");if(el)el.outerHTML=statusHTML();}
function statusHTML(){
  const m={local:["","Saved on this device"],syncing:["wait","Syncing…"],synced:["on","Synced to your account"],offline:["wait","Offline: saved on device, will sync"]}[Cloud.status];
  return `<span class="status" id="syncStatus"><span class="dot ${m[0]}"></span>${m[1]}</span>`;

async function initCloud(){
  try{
    let tries=0;while(!(window.claude&&window.claude.use)&&tries<30){await new Promise(r=>setTimeout(r,100));tries++;}
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const base="data/users/"+uid;
    Cloud.db=db;Cloud.profile=db.doc(base+"/profile");Cloud.workouts=Cloud.profile.collection("workouts");Cloud.draft=db.doc(base+"/draft");Cloud.days=Cloud.profile.collection("days");
    setStatus("syncing");
    const t=setTimeout(()=>{if(Cloud.status==="syncing")setStatus("offline");},10000);
    const [p,ws,d,ds]=await Promise.all([Cloud.profile.get(),Cloud.workouts.get(),Cloud.draft.get(),Cloud.days.get()]);
    clearTimeout(t);
    // profile: newest wins, tombstones union
    const pd=p.exists?p.data():null;
    if(pd){
      S.deleted=[...new Set([...(S.deleted||[]),...(pd.deleted||[])])];
      if((pd.updatedAt||0)>(S.profileAt||0)){S.settings={...S.settings,...(pd.settings||{})};S.custom=pd.custom||[];S.lastOpts=pd.lastOpts||{};if(pd.routines)S.routines=JSON.parse(JSON.stringify(pd.routines));S.bw=pd.bw?JSON.parse(JSON.stringify(pd.bw)):S.bw;if(pd.customFoods)S.customFoods=JSON.parse(JSON.stringify(pd.customFoods));if(pd.recentFoods)S.recentFoods=JSON.parse(JSON.stringify(pd.recentFoods));S.profileAt=pd.updatedAt;}
    }
    // workouts: union, minus deleted
    const del=new Set(S.deleted);const map=new Map();
    ws.docs.forEach(doc=>{if(!del.has(doc.id))map.set(doc.id,JSON.parse(JSON.stringify(doc.data())));});
    const localOnly=S.workouts.filter(w=>!map.has(w.id)&&!del.has(w.id));
    localOnly.forEach(w=>map.set(w.id,w));
    S.workouts=[...map.values()];
    // food days: newest wins per day
    S.days=S.days||{};const pushDays=new Set(Object.keys(S.days));
    ds.docs.forEach(doc=>{const cd=doc.data();const ld=S.days[doc.id];if(!ld||(cd.updatedAt||0)>=(ld.updatedAt||0)){S.days[doc.id]=JSON.parse(JSON.stringify(cd));pushDays.delete(doc.id);}else if((cd.updatedAt||0)===(ld.updatedAt||0))pushDays.delete(doc.id);});
    pushDays.forEach(k=>queueWrite("day_"+k,Cloud.days.doc(k),r=>r.set(JSON.parse(JSON.stringify(S.days[k])))));
    // draft: newest wins
    const dd=d.exists?d.data():null;
    if(dd&&(dd.updatedAt||0)>(S.draftAt||0)){S.draft=dd.draft?JSON.parse(JSON.stringify(dd.draft)):null;S.draftAt=dd.updatedAt;}
    if(migrate())S.profileAt=Date.now();dropStaleDraft();saveLocal();setStatus("synced");
    localOnly.forEach(w=>{const ref=Cloud.workouts.doc(w.id);queueWrite("w_"+w.id,ref,r=>r.set(w));});
    if(!pd||(S.profileAt>(pd.updatedAt||0)))queueWrite("profile",Cloud.profile,r=>r.set(profileBody()));
    if(!dd||S.draftAt>(dd.updatedAt||0))queueWrite("draft",Cloud.draft,r=>r.set({draft:S.draft,updatedAt:S.draftAt}));
    render();
  }catch(e){setStatus(Cloud.profile?"offline":"local");}
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const allEx=()=>[...EX,...S.custom];
const exById=id=>allEx().find(e=>e.id===id);
const groupName=id=>(GROUPS.find(g=>g.id===id)||{}).name||id;
const unit=()=>S.settings.unit;
function toDisp(lb){if(lb==null||lb==="")return"";const v=unit()==="kg"?lb/LB_PER_KG:lb;return String(Math.round(v*10)/10);}
function fromDisp(v){if(v===""||v==null)return null;const n=parseFloat(v);if(isNaN(n))return null;return unit()==="kg"?n*LB_PER_KG:n;}
function fmtW(lb){return lb==null?"BW":toDisp(lb)+" "+unit();}
function fmtDate(iso,opts){return new Date(iso).toLocaleDateString(undefined,opts||{weekday:"short",month:"short",day:"numeric"});}

function visibleOpts(ex,opts){
  return (ex.o||[]).filter(q=>!q.when||Object.entries(q.when).every(([k,vals])=>vals.includes(opts[k])));
}
function cleanOpts(ex,opts){const o={};visibleOpts(ex,opts).forEach(q=>{if(opts[q.key]!=null)o[q.key]=opts[q.key];});
  // re-run since hiding can cascade
  const o2={};visibleOpts(ex,o).forEach(q=>{if(o[q.key]!=null)o2[q.key]=o[q.key];});return o2;}
function choiceOf(ex,key,val){const q=(ex.o||[]).find(q=>q.key===key);return q&&q.choices.find(c=>c[0]===val);}
function flags(ex,opts){const f={bw:!!ex.bw,assist:!!ex.assist,time:!!ex.time};Object.entries(opts||{}).forEach(([k,v])=>{const c=choiceOf(ex,k,v);if(c&&c[3])Object.assign(f,c[3]);});return f;}
function variantLabel(ex,opts){return visibleOpts(ex,opts).map(q=>{const c=choiceOf(ex,q.key,opts[q.key]);return c?c[1]:null;}).filter(Boolean).join(" · ");}
function variantKey(exId,opts){return exId+"|"+Object.keys(opts).sort().map(k=>k+"="+opts[k]).join(",");}
function pfNote(ex,opts){
  let note=ex.pf||"";
  visibleOpts(ex,opts).forEach(q=>{const c=choiceOf(ex,q.key,opts[q.key]);if(c&&c[2])note=c[2];});
  return note;
}
function e1rm(w,r){return w&&r?w*(1+r/30):0;}
function setsOf(entry){return(entry.sets||[]).filter(s=>s.r!=null&&s.r!==""&&s.r>0);}

/* history per variant */
function sessionsFor(vk,excludeId){
  const out=[];
  S.workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
    if(w.id===excludeId)return;
    (w.entries||[]).forEach(en=>{
      if(en.vk!==vk)return;const sets=setsOf(en);if(!sets.length)return;
      const ws=sets.map(s=>s.w||0);
      const top=Math.max(...ws);const topSet=sets.find(s=>(s.w||0)===top);
      out.push({deload:!!(en.target&&en.target.deload),date:w.date,wid:w.id,sets,top,topReps:topSet.r,minW:Math.min(...ws),e1rm:Math.max(...sets.map(s=>e1rm(s.w,s.r))),vol:sets.reduce((a,s)=>a+(s.w||0)*s.r,0),maxReps:Math.max(...sets.map(s=>s.r))});
    });
  });
  return out;
}
function setsSummary(sets,f){
  if(!sets.length)return"No sets logged";
  const u=f&&f.time?"s":"";
  const groups=[];sets.forEach(s=>{const w=s.w==null?"BW":toDisp(s.w);const last=groups[groups.length-1];if(last&&last.w===w)last.r.push(s.r+u);else groups.push({w,r:[s.r+u]});});
  return groups.map(g=>(g.w==="BW"?"BW":g.w+" "+unit())+" × "+g.r.join(", ")).join(" · ");
}
function prCheck(entry,excludeId){
  const ex=exById(entry.exId);const f=ex?flags(ex,entry.opts):{};
  const prev=sessionsFor(entry.vk,excludeId);const sets=setsOf(entry);
  if(!prev.length||!sets.length)return null;
  if(f.assist){const best=Math.min(...prev.map(p=>p.minW));const mine=Math.min(...sets.map(s=>s.w||0));return mine<best?"Less assist":null;}
  if(f.bw||f.time){const best=Math.max(...prev.map(p=>p.maxReps));const mine=Math.max(...sets.map(s=>s.r));return mine>best?(f.time?"Longest hold":"Most reps"):null;}
  const best=Math.max(...prev.map(p=>p.top));const mine=Math.max(...sets.map(s=>s.w||0));
  if(mine>best)return"Weight PR";
  const bestE=Math.max(...prev.map(p=>p.e1rm));const myE=Math.max(...sets.map(s=>e1rm(s.w,s.r)));
  return myE>bestE+0.01?"Rep PR":null;
}

/* ============================================================
   DRAFT (current workout) ACTIONS
   ============================================================ */
function routines(){if(!S.routines)S.routines=defaultRoutines();return S.routines;}
function ensureDraft(){if(!S.draft){S.draft={id:uidGen(),start:new Date().toISOString(),entries:[]};}}
function makeEntry(exId,opts,target){
  const vk=variantKey(exId,opts);const prev=sessionsFor(vk);const last=prev[prev.length-1];
  const t=target||{sets:last?Math.max(last.sets.length,3):3,lo:S.settings.lo,hi:S.settings.hi,rest:S.settings.rest};
  const sets=Array.from({length:Math.max(1,t.sets)},()=>({w:null,r:null,done:false}));
  return{uid:uidGen(),exId,opts,vk,sets,target:t};
}
function addEntry(exId,opts,target){
  ensureDraft();
  S.draft.entries.push(makeEntry(exId,opts,target));
  S.lastOpts[exId]=opts;saveProfile();saveDraft();
  return S.draft.entries.length-1;
}
function phase(){return (S.settings.rampLeft||0)>0?"ramp":(S.settings.deloadLeft||0)>0?"deload":"normal";}
function effSets(it,ph){ph=ph||phase();const full=it.sets+(it.add||0);
  if(ph==="ramp")return it.p2?0:Math.max(2,it.sets-1);
  if(ph==="deload")return Math.max(1,Math.ceil(full/2));
  return full;}
function deloadDue(){return phase()==="normal"&&S.settings.deloadEvery>0&&(S.settings.sinceDeload||0)>=S.settings.deloadEvery*4+(S.settings.deloadSnooze||0);}
function startRoutine(rid){
  const r=routines().find(x=>x.id===rid);if(!r)return;
  S.draft={id:uidGen(),start:new Date().toISOString(),routineId:r.id,routineName:r.name,entries:[]};
  const ph=phase();const ramp=ph==="ramp",deload=ph==="deload";S.draft.ramp=ramp;S.draft.deload=deload;
  r.items.forEach(it=>{const n=effSets(it,ph);if(n&&exById(it.exId))S.draft.entries.push(makeEntry(it.exId,it.opts,{sets:n,lo:it.lo,hi:it.hi,rest:it.rest,tip:it.tip||"",ramp,deload}));});
  saveDraft();
}
function nextRoutine(){
  const rs=routines();if(!rs.length)return null;
  const last=S.workouts.filter(w=>w.routineId).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!last)return rs[0];const i=rs.findIndex(r=>r.id===last.routineId);return rs[(i+1)%rs.length];
}
const BIG_LOWER=["squat","legpress","rdl","deadlift","hipthrust","calf"];
function incLb(ex){const big=BIG_LOWER.includes(ex.id);return unit()==="kg"?(big?5:2.5)*LB_PER_KG:(big?10:5);}
/* Double progression coach: stay at a weight until every working set reaches the top of the rep range, then go up. */
function coach(en){
  const ex=exById(en.exId);const f=flags(ex,en.opts);const t=en.target||{sets:3,lo:S.settings.lo,hi:S.settings.hi};
  const prevAll=sessionsFor(en.vk);const prev=prevAll.filter(p=>!p.deload);const last=prev[prev.length-1]||prevAll[prevAll.length-1];
  const range=`${t.lo}–${t.hi}${f.time?" sec":" reps"}`;
  if(!last)return{w:null,r:t.lo,state:"new",msg:t.ramp&&!f.time?`Ramp-up: pick a weight where you can hit ${t.lo}–${t.hi} reps and still have 2–3 more in the tank. Start light; your strength will come back fast.`:f.time?`First time: hold as long as you can with good form.`:`First time: pick a weight you can lift for ${range} while stopping 1–2 reps short of failure.`};
  const reps=last.sets.map(s=>s.r);const lastTxt=setsSummary(last.sets,f);
  if(t.deload){const w=f.assist?last.minW:(last.top||null);return{w,r:t.lo,state:"deload",msg:`Recovery week: ${w?"use "+fmtW(w)+" (same as last time), ":""}do half the usual sets and stop 3–4 reps short of failure. Your muscles recover and you come back stronger next week.`};}
  if(f.time||(f.bw&&!last.top)){
    const hit=reps.every(r=>r>=t.hi);
    return{w:null,r:hit?t.hi:Math.max(...reps),state:hit?"up":"hold",msg:hit?`You hit ${t.hi}+ on every set last time (${lastTxt}). Make it harder: add weight, slow down the lowering, or pause at the hardest point.`:`Last time: ${lastTxt}. Try to add a rep to each set.`};
  }
  const work=last.sets.filter(s=>(s.w||0)===last.top);const inc=incLb(ex);
  if(f.assist){const ws=last.sets.filter(s=>(s.w||0)===last.minW);const hit=ws.length>=Math.min(t.sets,last.sets.length)&&ws.every(s=>s.r>=t.hi);
    const nw=Math.max(0,last.minW-inc);
    return hit?{w:nw,r:t.lo,state:"up",msg:`You hit ${t.hi} reps on every set with ${fmtW(last.minW)} of assist. Drop the assist to ${fmtW(nw)} and aim for ${t.lo}+.`}
      :{w:last.minW,r:null,state:"hold",msg:`Stay at ${fmtW(last.minW)} assist and add a rep or two. Last time: ${lastTxt}.`};}
  const hit=work.length>=Math.min(t.sets,last.sets.length)&&work.every(s=>s.r>=t.hi);
  if(hit){const nw=last.top+inc;return{w:nw,r:t.lo,state:"up",msg:`You hit ${t.hi} reps on every set at ${fmtW(last.top)}. Go up to ${fmtW(nw)} and aim for ${t.lo}+ reps per set.`};}
  if(work.some(s=>s.r<t.lo)&&work.every(s=>s.r<t.lo))return{w:Math.max(0,last.top-inc),r:t.lo,state:"down",msg:`Every set at ${fmtW(last.top)} was under ${t.lo} reps. Drop to ${fmtW(Math.max(0,last.top-inc))} so you're working in the ${range} range.`};
  return{w:last.top,r:null,state:"hold",msg:`Stay at ${fmtW(last.top)} and beat last time by a rep or two (${lastTxt}). Go up once every set reaches ${t.hi}.`};
}
function ghost(entry,i){
  const c=coach(entry);const prev=sessionsFor(entry.vk);const last=prev[prev.length-1];
  const ls=last?last.sets[Math.min(i,last.sets.length-1)]:null;
  let w=c.w!=null?c.w:(ls?ls.w:null);
  if(i>0&&entry.sets[i-1]&&entry.sets[i-1].w!=null&&(w==null||entry.sets[i-1].done))w=entry.sets[i-1].w;
  const r=c.r!=null?c.r:(ls?Math.min(ls.r+1,(entry.target||{}).hi||99):null);
  return{w,r};
}
function repClass(en,r){const t=en.target;if(!t||r==null)return"";return r<t.lo?"low":r>=t.hi?"top":"";}

  const lbl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);

  const dots=pts.map((p,i)=>`<circle cx="${xs(i)}" cy="${yv(p.y)}" r="${i===pts.length-1?5.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  const lp=pts[pts.length-1];

function day(k,create){if(!S.days)S.days={};if(!S.days[k]&&create)S.days[k]={items:[],updatedAt:0};return S.days[k]||{items:[]};}

function totals(k){const t={cal:0,c:0,fib:0,sug:0,p:0,f:0,na:0,sa:0,net:0};(day(k).items||[]).forEach(it=>{const q=it.qty||1;["cal","c","fib","sug","p","f","na","sa"].forEach(x=>t[x]+=(it.n[x]||0)*q);t.net+=netC(it.n)*q;});return t;}
const r1=x=>Math.round(x*10)/10;

/* ---------- gauge ---------- */
function gaugeSVG(val,goal,label,unitTxt){
  const pct=goal?Math.min(1,val/goal):0;const L=Math.PI*80;
  const col=val>goal?"var(--bad)":pct>=0.75?"var(--warn)":"var(--good)";
  const left=goal-val;
  return `<svg viewBox="0 0 200 118" class="gauge" role="img" aria-label="${label}: ${r1(val)} of ${goal} ${unitTxt}">
   <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--raised)" stroke-width="16" stroke-linecap="round"/>
   <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(pct*L).toFixed(1)} ${L.toFixed(1)}"/>
   <text x="100" y="80" text-anchor="middle" font-family="var(--display)" font-size="40" font-weight="700" fill="var(--text)">${left>=0?r1(left):"+"+r1(-left)}</text>
   <text x="100" y="104" text-anchor="middle" font-size="12" fill="var(--muted)">${left>=0?unitTxt+" left":unitTxt+" over"}</text>
   <text x="20" y="117" text-anchor="middle" font-size="10" fill="var(--muted)">0</text><text x="180" y="117" text-anchor="middle" font-size="10" fill="var(--muted)">${goal}</text></svg>`;
}
function meter(label,val,goal,kind,unitTxt){
  // kind: "limit" (stay under), "target" (reach it)
  const pct=goal?Math.min(100,val/goal*100):0;
  const col=kind==="limit"?(val>goal?"var(--bad)":pct>=75?"var(--warn)":"var(--good)"):(pct>=90?"var(--good)":"var(--accent)");
  const fm=x=>goal>=50?Math.round(x).toLocaleString():r1(x);
  const txt=kind==="limit"?(val>goal?`${fm(val-goal)} over`:`${fm(goal-val)} left`):(val>=goal?"goal hit":`${fm(goal-val)} to go`);
  return `<div class="meter"><div class="mrow"><span>${label}</span><span class="num">${Math.round(val).toLocaleString()} / ${goal.toLocaleString()}${unitTxt} · <b style="color:${col}">${txt}</b></span></div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}

  scanMsg("Found "+code+". Looking it up…");

  if(local){await stopScan();closeSheet();amountSheet(JSON.parse(JSON.stringify(local)),null);return;}
  try{let food=await fetchOFF(code);if(!food&&code.length===12)food=await fetchOFF("0"+code);
    await stopScan();closeSheet();
    if(food){food.barcode=code;amountSheet(food,null);}
    else{customSheet(code);toast("Not in the food database yet. Enter the label once and it will scan next time.");}
  }catch(e){scanMsg("No connection, so the barcode can't be looked up. Try again with signal, or add it from the label.");}
}

let T={end:0,iv:null,next:null,beeped:false,key:""};
let AC=null;
function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==="suspended")AC.resume();}catch(e){}}
function beep(){try{if(!AC)return;[0,0.25,0.5].forEach((d,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=k===2?1320:880;o.connect(g);g.connect(AC.destination);
  const t0=AC.currentTime+d;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);o.start(t0);o.stop(t0+0.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null;});}else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.draft)keepAwake(true);});
function ensureTicker(){clearInterval(T.iv);if(T.end||(S.draft&&S.draft.active))T.iv=setInterval(renderTimer,500);renderTimer();}
function startTimer(sec,next){sec=sec||S.settings.rest;T.next=next||null;T.beeped=false;if(!sec){T.end=0;ensureTicker();return;}T.end=Date.now()+sec*1000;if(S.draft){S.draft.rest={end:T.end,next:T.next};}ensureTicker();}
function stopRest(){T.end=0;T.next=null;if(S.draft)S.draft.rest=null;ensureTicker();}
const clock=sec=>{const a=Math.abs(sec);return(sec<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");};
function exName(e){const en=S.draft&&S.draft.entries[e];const ex=en&&exById(en.exId);return ex?ex.n:"";}
function renderTimer(){
  const slot=$("#timerSlot");const act=S.draft&&S.draft.active;
  const sc=document.getElementById("setClock");
  if(act){const sec=Math.floor((Date.now()-act.start)/1000);if(sc)sc.textContent=clock(sec);
    const key="act"+act.e+"-"+act.i;
    if(T.key!==key){T.key=key;slot.innerHTML=`<div class="timer live" role="timer"><span class="tl"><span class="sub">Set ${act.i+1} · ${esc(exName(act.e))}</span><span class="tv num" id="tbClock">${clock(sec)}</span></span><button class="btn primary" data-act="doneSet">Done</button></div>`;}
    else{const c=document.getElementById("tbClock");if(c)c.textContent=clock(sec);}
    return;}
  if(!T.end){if(T.key){slot.innerHTML="";T.key="";}clearInterval(T.iv);return;}
  const left=Math.round((T.end-Date.now())/1000);
  if(left<=0&&!T.beeped){T.beeped=true;beep();}
  if(left<-300){stopRest();return;}
  const nx=T.next;const nxt=nx?`Next: ${nx.i===0?esc(exName(nx.e)):"set "+(nx.i+1)+(nx.e!==(V.idx)?" · "+esc(exName(nx.e)):"")}`:"Rest";
  const key="rest"+(left<=0)+(nx?nx.e+"-"+nx.i:"");
  if(T.key!==key){T.key=key;
    slot.innerHTML=`<div class="timer ${left<=0?"end":""}" role="timer"><span class="tl"><span class="sub">${left>0?"Rest":"Rest over"} · ${nxt}</span><span class="tv num" id="tbClock">${clock(left)}</span></span>${left>0?`<button class="btn" data-act="t30">+30s</button>`:""}${nx?`<button class="btn primary" data-act="startSet" data-e="${nx.e}" data-v="${nx.i}">Start</button>`:`<button class="btn" data-act="tskip">Close</button>`}</div>`;}
  else{const c=document.getElementById("tbClock");if(c)c.textContent=clock(left);}
}
/* ---------- guided flow ---------- */
function nextUndone(fromE){
  if(!S.draft)return null;const es=S.draft.entries;const n=es.length;
  for(let k=0;k<n;k++){const e=(fromE+k)%n;const i=es[e].sets.findIndex(x=>!x.done);if(i>=0)return{e,i};}
  return null;
}
function startSet(e,i){
  if(!S.draft)return;unlockAudio();
  S.draft.active={e,i,start:Date.now()};T.end=0;T.next=null;S.draft.rest=null;saveDraft();keepAwake(true);
  if(V.view!=="log"||V.idx!==e)go("log",{idx:e});else render();
  ensureTicker();
}
function completeSet(e,i){
  const en=S.draft.entries[e];const s=en.sets[i];const g=ghost(en,i);
  if(s.r==null&&g.r!=null)s.r=g.r;if(s.w==null&&g.w!=null)s.w=g.w;
  if(s.r==null){toast("Enter your reps first");if(V.idx===e)$("#r"+i)?.focus();return;}
  s.done=true;S.draft.active=null;T.key="";
  const nx=nextUndone(e);saveDraft();
  if(!nx){stopRest();render();finishSheet(true);return;}
  startTimer(en.target&&en.target.rest,nx);
  if(nx.e!==e){toast(`${exName(e)} done. Next up: ${exName(nx.e)}`);go("log",{idx:nx.e});}else render();
  saveDraft();
}

      const o=[];if(c.eq.length>1)o.push({key:"equip",label:"Equipment",choices:c.eq.map(k=>{const e=CUSTOM_EQ.find(x=>x[0]===k);return k==="bw"?[k,e[1],"",{bw:true}]:[k,e[1]];})});
      if(c.angle)o.push({...ANGLE});
      const ex={id:"c_"+uidGen(),n:c.n.trim(),g:c.g,pf:c.pf.trim()||(c.eq.length===1?CUSTOM_EQ.find(x=>x[0]===c.eq[0])[1]:""),o,custom:true,bw:c.bw||(c.eq.length===1&&c.eq[0]==="bw"),time:c.time};
      S.custom.push(ex);saveProfile();toast("Exercise added");go("group",{group:ex.g});break;}
    case"rmCustom":S.custom=S.custom.filter(c=>c.id!==v);saveProfile();render();break;
    case"copyBackup":try{await navigator.clipboard.writeText(backupText());toast("Backup copied. Paste it into Notes or email to keep it safe.");}catch(e){toast("Copy was blocked by the browser");}break;
    case"dlBackup":{const fn="rep-ledger-backup-"+new Date().toISOString().slice(0,10)+".json";
      try{if(Cloud.dl){await Cloud.dl.save({filename:fn,data:backupText()});break;}
        const file=new File([backupText()],fn,{type:"application/json"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Rep Ledger backup"});}
        else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=fn;document.body.appendChild(a);a.click();a.remove();}
      }catch(e){}break;}
    case"import":{const txt=$("#importIn").value.trim();if(!txt)break;try{const d=JSON.parse(txt);if(!Array.isArray(d.workouts))throw 0;
      const have=new Set(S.workouts.map(w=>w.id));let n=0;d.workouts.forEach(w=>{if(!have.has(w.id)){saveWorkout(w);n++;}});
      (d.custom||[]).forEach(c=>{if(!S.custom.find(x=>x.id===c.id))S.custom.push(c);});saveProfile();toast(`Restored ${n} workout${n===1?"":"s"}`);render();}catch(e){toast("That doesn't look like a Rep Ledger backup");}break;}
  }
});
function addToRoutine(exId,opts){const r=routines().find(x=>x.id===V.pickFor);V.pickFor=null;
  if(r){r.items.push({exId,opts,sets:3,lo:S.settings.lo,hi:S.settings.hi,rest:90});S.lastOpts[exId]=opts;saveProfile();toast("Added to "+r.name);}
  go("routine",{rid:r?r.id:V.rid});}
function vPickGroup(){return header("Add to "+esc((routines().find(x=>x.id===V.pickFor)||{}).name||"workout"),"Pick a muscle group","pickCancel")+`<div class="grid">`+GROUPS.map(g=>`<button class="gbtn" data-act="group" data-v="${g.id}"><b>${g.name}</b><span>${g.blurb}</span></button>`).join("")+`</div>`;}
function backupText(){return JSON.stringify({app:"rep-ledger",version:1,exported:new Date().toISOString(),settings:S.settings,custom:S.custom,workouts:S.workouts});}

document.addEventListener("toggle",ev=>{if(ev.target.id==="addFold")V.addOpen=ev.target.open;},true);
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){V.q=t.value;const pos=t.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}return;}
  if(t.dataset.field&&S.draft){const en=S.draft.entries[V.idx];const s=en.sets[+t.dataset.i];
    if(t.dataset.field==="w")s.w=fromDisp(t.value);else{const n=parseInt(t.value,10);s.r=isNaN(n)?null:n;t.className=repClass(en,s.r);}saveDraft();return;}
  if(t.dataset.rf){const r=routines().find(x=>x.id===V.rid);const n=parseInt(t.value,10);if(!isNaN(n)&&n>=0){r.items[+t.dataset.ri][t.dataset.rf]=n;saveProfile();}return;}
  if(t.dataset.rname){const r=routines().find(x=>x.id===V.rid);r.name=t.value;saveProfile();return;}
  if(t.dataset.goalw){const w=fromDisp(t.value);if(w){S.settings.goalW=Math.round(w*10)/10;saveProfile();}return;}
  if(t.dataset.setting){const n=parseInt(t.value,10);if(!isNaN(n)&&n>=0){S.settings[t.dataset.setting]=n;saveProfile();}return;}
  if(t.dataset.cf){V.customDraft[t.dataset.cf]=t.value;const s=$("#cSave");if(s)s.disabled=!V.customDraft.n.trim();}
});

/* ============================================================
   BOOT
   ============================================================ */
loadLocal();
if(migrate())saveProfile();
function dropStaleDraft(){if(S.draft&&!S.draft.entries.some(e=>setsOf(e).length)&&Date.now()-new Date(S.draft.start)>12*3600e3){S.draft=null;saveDraft();return true;}return false;}
dropStaleDraft();
if(S.draft&&S.draft.rest&&S.draft.rest.end>Date.now()-300000){T.end=S.draft.rest.end;T.next=S.draft.rest.next;T.beeped=T.end<Date.now();}
render();ensureTicker();
initCloud();
(async()=>{try{let i=0;while(!(window.claude&&window.claude.use)&&i<30){await new Promise(r=>setTimeout(r,100));i++;}
  if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){Cloud.dl=dl;if(V.view==="settings")render();}}}catch(e){}})();
</script>

window.REP_PWA=true;
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
