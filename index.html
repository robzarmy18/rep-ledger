<style>
/* Layout idea: one-handed gym tool. Dark graphite "plate" surfaces, signal-orange for the next action, bottom tab bar. */
:root{
  --bg:#111315;
  --surface:#1b1e22;
  --raised:#252a30;
  --line:#323840;
  --text:#eef0f2;
  --muted:#98a1ab;
  --accent:#ff7a33;
  --accent-ink:#1a0d05;
  --good:#3ccf8e;
  --warn:#f4c84a;
  --bad:#ff5d5d;
  --klight:#b6e05c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 140px calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px}
.top .grow{flex:1;min-width:0}
.back{background:var(--raised);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:20px;flex:none}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.pill.pr{background:rgba(255,122,51,.15);color:var(--accent);border-color:rgba(255,122,51,.4)}
.pill.ok{color:var(--good);border-color:rgba(60,207,142,.4)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}.dot.wait{background:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.hot{border-color:rgba(255,122,51,.55);box-shadow:inset 3px 0 0 var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.gbtn b{font-family:var(--display);font-size:24px;font-weight:700}
.gbtn span{color:var(--muted);font-size:13px}
.gbtn:active,.row:active{background:var(--raised)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.chev{color:var(--muted)}
.sect{font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -6px}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,93,93,.4);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.q{display:flex;flex-direction:column;gap:8px}
.q label,.lbl{font-weight:600;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:9px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted);background:var(--raised);border-radius:8px;padding:8px 10px;border-left:3px solid var(--accent)}
input[type=text],input[type=number],input[type=search],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:90px;resize:vertical}
.sets{display:flex;flex-direction:column;gap:8px}
.sethead,.set{display:grid;grid-template-columns:22px 1fr 1fr 50px 44px 24px;gap:6px;align-items:center}
.sethead{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.set .n{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.set input{text-align:center;font-size:18px;font-weight:600;padding:8px}
.set input::placeholder{color:#5d6670;font-weight:500}
.tick{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:20px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#04140c}
.x{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:18px}
.set.done input{border-color:rgba(60,207,142,.5)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}.rgrid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}.rgrid input{min-height:38px;padding:6px;text-align:center}
.set input.low{border-color:var(--warn)}.set input.top{border-color:var(--good)}
.coach{display:flex;flex-direction:column;gap:4px}.coach b{font-family:var(--display);font-size:18px}
.bar{height:10px;background:var(--raised);border-radius:99px;overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar .zone{position:absolute;top:0;bottom:0;border-left:1px dashed var(--muted);border-right:1px dashed var(--muted)}
.daychips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.daychips .chip{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;border-radius:12px}.daychips small{font-size:11px;font-weight:600;opacity:.75;line-height:1.1}
.guide{gap:12px}.guide h2{font-size:26px}.guide.live{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}.guide.done{border-color:var(--good)}
.bigclock{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--good)}
.btn.big{min-height:58px;font-size:18px}
.set.activeset{background:rgba(60,207,142,.08);border-radius:10px;outline:1px solid rgba(60,207,142,.5)}
.timer .tl{display:flex;flex-direction:column;flex:1;min-width:0}.timer .tl .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.live{border-color:var(--good)}
.gwrap{display:flex;justify-content:center}.gauge{width:min(300px,100%);height:auto}
.meter{display:flex;flex-direction:column;gap:4px}.mrow{display:flex;justify-content:space-between;gap:8px;font-size:14px}.mrow span:first-child{font-weight:600}
.ins{font-size:14px;padding:9px 11px;border-radius:8px;background:var(--raised);border-left:3px solid var(--muted)}.ins.bad{border-left-color:var(--bad)}.ins.warn{border-left-color:var(--warn)}.ins.info{border-left-color:#4aa8ff}
nav button{font-size:11px;padding-left:2px;padding-right:2px}
.reader{width:100%;min-height:220px;background:#000;border-radius:12px;overflow:hidden}.reader video{width:100%!important;height:auto!important;display:block}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}.wkc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wkb{position:relative;width:100%;height:64px;background:var(--raised);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}.wkb i{display:block;width:100%;border-radius:6px 6px 0 0}.wkg{position:absolute;left:0;right:0;border-top:1px dashed var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:86px;border-top:3px solid var(--line)}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.05;word-break:break-word}.tile .k{font-size:11.5px;color:var(--muted);line-height:1.25}
.tile.good{border-top-color:var(--good)}.tile.warn{border-top-color:var(--warn)}.tile.bad{border-top-color:var(--bad)}
.slist{display:flex;flex-direction:column}.srow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.srow:last-child{border-bottom:0}.srow .grow{flex:1;min-width:0}.srow.done .grow{text-decoration:line-through;color:var(--muted)}
.tick.sm{width:34px;height:34px;font-size:15px;flex:none}
.jentry{border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:4px}.jentry .top{justify-content:space-between}.jtext{white-space:pre-wrap;font-size:15px;color:var(--text)}
.lockscr{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.rcode{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.08em;text-align:center;background:var(--raised);border-radius:10px;padding:14px}
body.privacy #app{filter:blur(18px)}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}
.kbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.kbtn{min-height:62px;padding:6px;text-align:center;line-height:1.15;border-radius:12px;border:2px solid var(--line);background:var(--raised);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.kbtn.in[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#04140c}.kbtn.out[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#200}.kbtn.light[aria-pressed="true"]{background:var(--klight);border-color:var(--klight);color:#0d1a04}
.card.kin{border-color:rgba(60,207,142,.6)}.card.klight{border-color:rgba(182,224,92,.6)}
.tile.klight{border-top-color:var(--klight)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;padding:4px 0}.chk input{width:22px;height:22px;accent-color:var(--accent)}
.mrowc{display:flex;justify-content:space-between;gap:8px}.cost{font-weight:700;white-space:nowrap}.cost.none{color:var(--accent);font-weight:600;font-size:13px}
.glance .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}.glance .kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.glance .stat .v{font-size:22px}.glance .stat .k{font-size:11.5px}.card.kout{border-color:rgba(255,93,93,.6)}
.frow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.frow:last-of-type{border-bottom:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}
.obhead{display:flex;flex-direction:column;gap:6px}.obbar{height:6px;background:var(--raised);border-radius:99px;overflow:hidden}.obbar i{display:block;height:100%;background:var(--accent)}
.obnav{position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px;box-shadow:0 -12px 16px var(--bg)}body.onboarding nav{display:none}body.onboarding #app{padding-bottom:40px}
.dnlabel{position:relative;display:inline-block;cursor:pointer}.dnlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0}
.diff{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:12px;font-weight:700;color:var(--muted);padding:0}.diff.on{color:#111}.diff.ghost{opacity:.75;border-style:dashed}
.exnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));width:min(608px,calc(100% - 32px));display:flex;gap:10px;z-index:4;background:var(--bg);padding:8px 0;box-shadow:0 -10px 14px var(--bg)}.exnav .btn{flex:1;min-height:56px;font-size:17px}
body:has(.exnav) #app{padding-bottom:210px}
body.timing #app{padding-top:104px}
.tprog{order:9;flex-basis:100%;height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:2px}.tprog i{display:block;height:100%;background:var(--accent);transition:width .5s linear}.timer.end .tprog i{background:var(--good)}
.ring{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--raised) 0)}.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700}
.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}.fold summary{list-style:none;cursor:pointer;padding:14px;font-family:var(--display);font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.fold summary::-webkit-details-marker{display:none}.fold[open] summary .chev{transform:rotate(180deg)}.fold .chev{font-size:22px;transition:transform .15s}.foldbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--raised);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text)}
.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px 12px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(17,19,21,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:12px 4px 14px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent)}
.timer{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));flex-wrap:wrap;z-index:6;background:var(--raised);border:1px solid var(--accent);border-radius:14px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);width:min(608px,calc(100% - 32px))}
.timer .tv{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05}
.timer.end{border-color:var(--good)}
.timer .btn{min-height:38px;padding:6px 12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px 16px 24px;width:100%;max-width:640px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--good);color:#04140c;font-weight:600;padding:10px 16px;border-radius:10px;z-index:20}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tick{transition:background .12s,border-color .12s}}
@media (max-width:380px){.sethead,.set{grid-template-columns:18px 1fr 1fr 46px 40px 22px;gap:5px}.tick{width:40px;height:40px}}
</style>

<div id="timerSlot"></div>

<script>
"use strict";
/* ============================================================
   EXERCISE LIBRARY  (tailored to typical Planet Fitness gear)
   choice: [value, label, pfNote?, flags?]   flags: {bw, assist}
   option.when: {otherKey:[values]} -> only asked when matched
   ============================================================ */
const GROUPS=[
  {id:"chest",name:"Chest",blurb:"Press, fly, push-ups"},
  {id:"back",name:"Back",blurb:"Pulldowns, rows, deadlifts"},
  {id:"shoulders",name:"Shoulders",blurb:"Press, raises, rear delts"},
  {id:"arms",name:"Arms",blurb:"Biceps, triceps, forearms"},
  {id:"legs",name:"Legs & Glutes",blurb:"Squat, press, curls, calves"},
  {id:"core",name:"Core",blurb:"Abs, obliques, planks"},
  {id:"cardio",name:"Cardio",blurb:"Treadmill, stairs, bike, walks"}
];
const ANGLE={key:"angle",label:"Bench angle",choices:[["flat","Flat"],["incline","Incline"],["decline","Decline"]]};
const SMITH=["smith","Smith Machine","Smith Machine. Bar weight differs by model, so log the plates you load and stay consistent."];
const DB=["db","Dumbbells","Dumbbell rack"];
const BB=["bb","Barbell","Free barbell + plates"];
const SEATSTAND={key:"pos",label:"Position",choices:[["seated","Seated"],["standing","Standing"]]};
const EX=[
// CHEST
{id:"bench",n:"Bench Press",g:"chest",pf:"Smith Machine or dumbbells with an adjustable bench",o:[
  {key:"equip",label:"Equipment",choices:[["bb","Barbell","Free barbell bench. Log total weight including the 45 lb bar."],[...SMITH.slice(0,2),"Smith Machine with an adjustable bench rolled underneath. Log the plates you load."],["db","Dumbbells","Dumbbell rack + adjustable bench. Log the weight of one dumbbell."]]},ANGLE]},
{id:"chestpress",n:"Chest Press Machine",g:"chest",o:[
  {key:"type",label:"Which machine",choices:[["seated","Chest Press","Pin-loaded \"Chest Press\" machine"],["incline","Incline Chest Press","Incline press machine (pin or plate-loaded, varies by club)"],["plate","Plate-loaded Press","Plate-loaded lever press, where available"]]}]},
{id:"fly",n:"Chest Fly",g:"chest",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Pec Fly machine","\"Pec Fly / Rear Delt\" machine. Sit facing away from the pad."],["cable","Cable Crossover","Dual adjustable pulley / cable crossover station"],["db","Dumbbells","Dumbbells on a bench"]]},
  {key:"height",label:"Pulley height",when:{equip:["cable"]},choices:[["high","High to low"],["mid","Chest height"],["low","Low to high"]]},
  {...ANGLE,when:{equip:["db"]}}]},
{id:"pushup",n:"Push-Ups",g:"chest",bw:true,pf:"Bodyweight. Add a plate on your back for extra load.",o:[
  {key:"style",label:"Style",choices:[["std","Standard"],["incline","Incline (hands on bench)"],["decline","Decline (feet on bench)"]]}]},
{id:"dipchest",n:"Chest Dips",g:"chest",o:[
  {key:"equip",label:"Equipment",choices:[["assist","Assisted Dip machine","Assisted Dip/Chin machine. Log the assist weight: lower means stronger.",{assist:true}],["bw","Bodyweight dips","Dip handles on the assisted machine",{bw:true}]]}]},
// BACK
{id:"pulldown",n:"Lat Pulldown",g:"back",o:[
  {key:"equip",label:"Equipment",choices:[["machine","Lat Pulldown machine","Pin-loaded \"Lat Pulldown\" with knee pad"],["cable","Cable station","Cable crossover, high pulley, kneeling or seated"]]},
  {key:"grip",label:"Grip",choices:[["wide","Wide overhand"],["close","Close / V-handle"],["under","Underhand"],["neutral","Neutral"]]}]},

function allPrograms(){return[...(S.customProgram?[{id:"custom",name:"Built for you",desc:"Made from your setup answers: your goal, schedule, experience, equipment and any joints to work around.",days:S.customProgram.map(d=>({id:d.id,name:d.name,items:d.items}))}]:[]),...PROGRAMS];}
function defaultRoutines(pid){const P=allPrograms().find(x=>x.id===(pid||S.settings.program))||allPrograms()[0];
  return P.days.map(r=>({id:r.id,name:r.name,items:r.items.map(([exId,opts,sets,lo,hi,rest,tip,x])=>({exId,opts,sets,lo,hi,rest,tip:tip||"",add:(x&&x.add)||0,p2:!!(x&&x.p2)}))}));}
function migrate3(){
  if(S.settings.v3)return false;S.settings.v3=true;
  if(S.settings.program!=="ul"||!S.routines)return true;
  const same=(it,exId,opts)=>it.exId===exId&&JSON.stringify(it.opts)===JSON.stringify(opts);
  UL.forEach(d=>{const r=S.routines.find(x=>x.id===d.id);if(!r)return;
    d.items.forEach((t,k)=>{const x=t[7];if(!x)return;const it=r.items.find(i=>same(i,t[0],t[1]));
      if(it){if(x.add)it.add=x.add;if(x.p2)it.p2=true;}
      else if(x.p2){const at=Math.min(k,r.items.length);r.items.splice(at,0,{exId:t[0],opts:t[1],sets:t[2],lo:t[3],hi:t[4],rest:t[5],tip:t[6]||"",add:0,p2:true});}});});
  return true;
}
function migrate(){
  const m3=()=>migrate3();
  if(S.settings.program)return m3();
  const wasDefault=!S.routines||JSON.stringify(S.routines.map(r=>({id:r.id,items:r.items.map(i=>[i.exId,i.opts,i.sets,i.lo,i.hi,i.rest])})))===JSON.stringify(SPLIT.map(r=>({id:r.id,items:r.items.map(i=>i.slice(0,6))})));
  if(wasDefault){S.settings.program="ul";S.routines=defaultRoutines("ul");}else S.settings.program="split";
  m3();return true;
}

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);S={...S,...d,settings:{...S.settings,...(d.settings||{})}};}}catch(e){}
}
function saveLocal(){S.savedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}if(typeof idbSave==="function")idbSave();}

function queueWrite(key,ref,fn){
  Cloud.chains[key]=(Cloud.chains[key]||Promise.resolve()).then(()=>fn(ref)).then(()=>{if(Cloud.status!=="local")setStatus("synced");}).catch(err=>{
    if(err&&err.code==="quota_exceeded"){toast("Cloud storage is full. Your data is still saved on this device.");}
    else if(err&&err.code==="unavailable"){return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>fn(ref)).catch(()=>setStatus("offline"));}
    else setStatus("offline");
  });
}
function debounced(key,ms,fn){clearTimeout(Cloud.timers[key]);Cloud.timers[key]=setTimeout(fn,ms);}
function profileBody(){return{settings:S.settings,custom:S.custom,lastOpts:S.lastOpts,routines:S.routines,bw:S.bw,recipes:S.recipes||[],recipesSeeded:!!S.recipesSeeded,money:S.money||null,plan:S.plan||null,profile:S.profile||null,customProgram:S.customProgram||null,shop:S.shop,customFoods:S.customFoods,recentFoods:(S.recentFoods||[]).slice(0,30),deleted:S.deleted.slice(-500),updatedAt:S.profileAt};}
function saveProfile(){
  S.profileAt=Date.now();saveLocal();
  if(Cloud.profile)debounced("profile",1200,()=>queueWrite("profile",Cloud.profile,r=>r.set(profileBody())));
}
function saveDraft(){
  S.draftAt=Date.now();saveLocal();
  if(Cloud.draft)debounced("draft",2000,()=>queueWrite("draft",Cloud.draft,r=>r.set({draft:S.draft,updatedAt:S.draftAt})));
}
function saveWorkout(w){
  S.workouts=S.workouts.filter(x=>x.id!==w.id);S.workouts.push(w);saveLocal();
  if(Cloud.workouts){const ref=Cloud.workouts.doc(w.id);queueWrite("w_"+w.id,ref,r=>r.set(w));}
}
function deleteWorkout(id){
  S.workouts=S.workouts.filter(x=>x.id!==id);S.deleted.push(id);saveProfile();
  if(Cloud.workouts){const ref=Cloud.workouts.doc(id);queueWrite("w_"+id,ref,r=>r.delete());}
}
function setStatus(s){Cloud.status=s;const el=document.getElementById("syncStatus");if(el)el.outerHTML=statusHTML();}
function statusHTML(){
  const m={local:["","Saved on this device"],syncing:["wait","Syncing…"],synced:["on","Synced to your account"],offline:["wait","Offline: saved on device, will sync"]}[Cloud.status];
  return `<span class="status" id="syncStatus"><span class="dot ${m[0]}"></span>${m[1]}</span>`;
}

async function initCloud(){
  try{
    let tries=0;while(!(window.claude&&window.claude.use)&&tries<30){await new Promise(r=>setTimeout(r,100));tries++;}
    if(!(window.claude&&window.claude.use))return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const base="data/users/"+uid;
    Cloud.db=db;Cloud.profile=db.doc(base+"/profile");Cloud.workouts=Cloud.profile.collection("workouts");Cloud.draft=db.doc(base+"/draft");Cloud.days=Cloud.profile.collection("days");
    setStatus("syncing");
    const t=setTimeout(()=>{if(Cloud.status==="syncing")setStatus("offline");},10000);
    const [p,ws,d,ds]=await Promise.all([Cloud.profile.get(),Cloud.workouts.get(),Cloud.draft.get(),Cloud.days.get()]);
    clearTimeout(t);
    // profile: newest wins, tombstones union
    const pd=p.exists?p.data():null;
    if(pd){
      S.deleted=[...new Set([...(S.deleted||[]),...(pd.deleted||[])])];
      if((pd.updatedAt||0)>(S.profileAt||0)){S.settings={...S.settings,...(pd.settings||{})};S.custom=pd.custom||[];S.lastOpts=pd.lastOpts||{};if(pd.routines)S.routines=JSON.parse(JSON.stringify(pd.routines));S.bw=pd.bw?JSON.parse(JSON.stringify(pd.bw)):S.bw;if(pd.recipes&&pd.recipes.length)S.recipes=JSON.parse(JSON.stringify(pd.recipes));if(pd.recipesSeeded)S.recipesSeeded=true;if(pd.money)S.money=JSON.parse(JSON.stringify(pd.money));if(pd.plan)S.plan=JSON.parse(JSON.stringify(pd.plan));if(pd.profile)S.profile=JSON.parse(JSON.stringify(pd.profile));if(pd.customProgram)S.customProgram=JSON.parse(JSON.stringify(pd.customProgram));if(pd.shop)S.shop=JSON.parse(JSON.stringify(pd.shop));if(pd.customFoods)S.customFoods=JSON.parse(JSON.stringify(pd.customFoods));if(pd.recentFoods)S.recentFoods=JSON.parse(JSON.stringify(pd.recentFoods));S.profileAt=pd.updatedAt;}
    }
    // workouts: union, minus deleted
    const del=new Set(S.deleted);const map=new Map();
    ws.docs.forEach(doc=>{if(!del.has(doc.id))map.set(doc.id,JSON.parse(JSON.stringify(doc.data())));});
    const localOnly=S.workouts.filter(w=>!map.has(w.id)&&!del.has(w.id));
    localOnly.forEach(w=>map.set(w.id,w));
    S.workouts=[...map.values()];

    S.days=S.days||{};const pushDays=new Set(Object.keys(S.days));
    ds.docs.forEach(doc=>{const cd=doc.data();const ld=S.days[doc.id];if(!ld||(cd.updatedAt||0)>=(ld.updatedAt||0)){S.days[doc.id]=JSON.parse(JSON.stringify(cd));pushDays.delete(doc.id);}else if((cd.updatedAt||0)===(ld.updatedAt||0))pushDays.delete(doc.id);});
    pushDays.forEach(k=>queueWrite("day_"+k,Cloud.days.doc(k),r=>r.set(JSON.parse(JSON.stringify(S.days[k])))));
    // draft: newest wins
    const dd=d.exists?d.data():null;
    if(dd&&(dd.updatedAt||0)>(S.draftAt||0)){S.draft=dd.draft?JSON.parse(JSON.stringify(dd.draft)):null;S.draftAt=dd.updatedAt;}
    if(migrate())S.profileAt=Date.now();dropStaleDraft();saveLocal();setStatus("synced");
    localOnly.forEach(w=>{const ref=Cloud.workouts.doc(w.id);queueWrite("w_"+w.id,ref,r=>r.set(w));});
    if(!pd||(S.profileAt>(pd.updatedAt||0)))queueWrite("profile",Cloud.profile,r=>r.set(profileBody()));
    if(!dd||S.draftAt>(dd.updatedAt||0))queueWrite("draft",Cloud.draft,r=>r.set({draft:S.draft,updatedAt:S.draftAt}));
    render();
  }catch(e){setStatus(Cloud.profile?"offline":"local");}
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const allEx=()=>[...EX,...S.custom];
const exById=id=>allEx().find(e=>e.id===id);
const groupName=id=>(GROUPS.find(g=>g.id===id)||{}).name||id;
const unit=()=>S.settings.unit;
function toDisp(lb){if(lb==null||lb==="")return"";const v=unit()==="kg"?lb/LB_PER_KG:lb;return String(Math.round(v*10)/10);}
function fromDisp(v){if(v===""||v==null)return null;const n=parseFloat(v);if(isNaN(n))return null;return unit()==="kg"?n*LB_PER_KG:n;}
function fmtW(lb){return lb==null?"BW":toDisp(lb)+" "+unit();}
function fmtDate(iso,opts){return new Date(iso).toLocaleDateString(undefined,opts||{weekday:"short",month:"short",day:"numeric"});}

function visibleOpts(ex,opts){
  return (ex.o||[]).filter(q=>!q.when||Object.entries(q.when).every(([k,vals])=>vals.includes(opts[k])));
}
function cleanOpts(ex,opts){const o={};visibleOpts(ex,opts).forEach(q=>{if(opts[q.key]!=null)o[q.key]=opts[q.key];});
  // re-run since hiding can cascade
  const o2={};visibleOpts(ex,o).forEach(q=>{if(o[q.key]!=null)o2[q.key]=o[q.key];});return o2;}
function choiceOf(ex,key,val){const q=(ex.o||[]).find(q=>q.key===key);return q&&q.choices.find(c=>c[0]===val);}
function TU(f){return f&&f.mins?{s:" min",w:"min",L:"Minutes"}:{s:"s",w:"sec",L:"Seconds"};}
function flags(ex,opts){const f={bw:!!ex.bw,assist:!!ex.assist,time:!!ex.time,mins:!!ex.mins};Object.entries(opts||{}).forEach(([k,v])=>{const c=choiceOf(ex,k,v);if(c&&c[3])Object.assign(f,c[3]);});return f;}
function variantLabel(ex,opts){return visibleOpts(ex,opts).map(q=>{const c=choiceOf(ex,q.key,opts[q.key]);return c?c[1]:null;}).filter(Boolean).join(" · ");}
function variantKey(exId,opts){return exId+"|"+Object.keys(opts).sort().map(k=>k+"="+opts[k]).join(",");}
function pfNote(ex,opts){
  let note=ex.pf||"";
  visibleOpts(ex,opts).forEach(q=>{const c=choiceOf(ex,q.key,opts[q.key]);if(c&&c[2])note=c[2];});
  return note;
}
function e1rm(w,r){return w&&r?w*(1+r/30):0;}
function setsOf(entry){return(entry.sets||[]).filter(s=>s.r!=null&&s.r!==""&&s.r>0);}

/* history per variant */
function sessionsFor(vk,excludeId){
  const out=[];
  S.workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
    if(w.id===excludeId)return;
    (w.entries||[]).forEach(en=>{
      if(en.vk!==vk)return;const sets=setsOf(en);if(!sets.length)return;
      const ws=sets.map(s=>s.w||0);
      const top=Math.max(...ws);const topSet=sets.find(s=>(s.w||0)===top);
      out.push({deload:!!(en.target&&en.target.deload),date:w.date,wid:w.id,sets,top,topReps:topSet.r,minW:Math.min(...ws),e1rm:Math.max(...sets.map(s=>e1rm(s.w,s.r))),vol:sets.reduce((a,s)=>a+(s.w||0)*s.r,0),maxReps:Math.max(...sets.map(s=>s.r))});
    });
  });
  return out;
}
function setsSummary(sets,f){
  if(!sets.length)return"No sets logged";
  const u=f&&f.time?TU(f).s:"";
  const groups=[];sets.forEach(s=>{const w=s.w==null?"BW":toDisp(s.w);const last=groups[groups.length-1];if(last&&last.w===w)last.r.push(s.r+u);else groups.push({w,r:[s.r+u]});});
  return groups.map(g=>(g.w==="BW"?"BW":g.w+" "+unit())+" × "+g.r.join(", ")).join(" · ");
}
function prCheck(entry,excludeId){
  const ex=exById(entry.exId);const f=ex?flags(ex,entry.opts):{};
  const prev=sessionsFor(entry.vk,excludeId);const sets=setsOf(entry);
  if(!prev.length||!sets.length)return null;
  if(f.assist){const best=Math.min(...prev.map(p=>p.minW));const mine=Math.min(...sets.map(s=>s.w||0));return mine<best?"Less assist":null;}
  if(f.bw||f.time){const best=Math.max(...prev.map(p=>p.maxReps));const mine=Math.max(...sets.map(s=>s.r));return mine>best?(f.time?"Longest hold":"Most reps"):null;}
  const best=Math.max(...prev.map(p=>p.top));const mine=Math.max(...sets.map(s=>s.w||0));
  if(mine>best)return"Weight PR";
  const bestE=Math.max(...prev.map(p=>p.e1rm));const myE=Math.max(...sets.map(s=>e1rm(s.w,s.r)));
  return myE>bestE+0.01?"Rep PR":null;
}

   DRAFT (current workout) ACTIONS

function routines(){if(!S.routines)S.routines=defaultRoutines();return S.routines;}
function ensureDraft(){if(!S.draft){S.draft={id:uidGen(),start:new Date().toISOString(),entries:[]};}}
function makeEntry(exId,opts,target){
  const vk=variantKey(exId,opts);const prev=sessionsFor(vk);const last=prev[prev.length-1];
  const t=target||{sets:last?Math.max(last.sets.length,3):3,lo:S.settings.lo,hi:S.settings.hi,rest:S.settings.rest};
  const sets=Array.from({length:Math.max(1,t.sets)},()=>({w:null,r:null,done:false}));
  return{uid:uidGen(),exId,opts,vk,sets,target:t};
}
function addEntry(exId,opts,target){
  ensureDraft();
  S.draft.entries.push(makeEntry(exId,opts,target));
  S.lastOpts[exId]=opts;saveProfile();saveDraft();
  return S.draft.entries.length-1;
}
function phase(){return (S.settings.rampLeft||0)>0?"ramp":(S.settings.deloadLeft||0)>0?"deload":"normal";}
function effSets(it,ph){ph=ph||phase();const full=it.sets+(it.add||0);
  if(ph==="ramp")return it.p2?0:it.sets>=3?it.sets-1:it.sets;
  if(ph==="deload")return Math.max(1,Math.ceil(full/2));
  return full;}
function deloadDue(){return phase()==="normal"&&S.settings.deloadEvery>0&&(S.settings.sinceDeload||0)>=S.settings.deloadEvery*4+(S.settings.deloadSnooze||0);}
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function trainDays(){if(S.settings.trainDays&&S.settings.trainDays.length)return S.settings.trainDays;const n=(S.profile&&+S.profile.days)||routines().length||4;
  return{2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]}[Math.min(6,Math.max(2,n))];}
function wday(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).getDay();}
function doneOn(k){return S.workouts.filter(w=>dayKey(new Date(w.date))===k).sort((a,b)=>a.date.localeCompare(b.date));}
function planFor(k){
  const ov=(S.plan||{})[k];if(ov)return ov.rest?{rest:true,custom:true}:{...ov,id:ov.routineId,custom:true};
  if(k<dayKey())return null;
  if(!trainDays().includes(wday(k)))return{rest:true};
  const rs=routines();if(!rs.length)return null;const nx=nextRoutine();let i=Math.max(0,rs.indexOf(nx));
  const today=dayKey();const busyToday=(S.draft&&S.draft.routineId)||doneOn(today).some(w=>w.routineId);
  let kk=today;if(busyToday){kk=shiftDay(today,1);if(S.draft&&S.draft.routineId&&!doneOn(today).some(w=>w.routineId))i++;}
  while(kk<k){if(trainDays().includes(wday(kk))&&!(S.plan||{})[kk])i++;kk=shiftDay(kk,1);}
  const r=rs[i%rs.length];return{...r,routineId:r.id};
}
function ensurePlan(k){S.plan=S.plan||{};if(!S.plan[k]||S.plan[k].rest){const p=planFor(k);const base=p&&!p.rest?p:(nextRoutine()||routines()[0]);
  S.plan[k]={routineId:base.routineId||base.id,name:base.name,items:JSON.parse(JSON.stringify(base.items))};}
  const cut=shiftDay(dayKey(),-45);Object.keys(S.plan).forEach(x=>{if(x<cut)delete S.plan[x];});return S.plan[k];}
function edTarget(){return V.planDate?ensurePlan(V.planDate):routines().find(x=>x.id===V.rid);}
function startRoutine(rid,k){
  k=k||dayKey();const ov=(S.plan||{})[k];
  const r=ov&&!ov.rest&&ov.routineId===rid?{id:ov.routineId,name:ov.name,items:ov.items}:routines().find(x=>x.id===rid);if(!r)return;
  S.draft={id:uidGen(),start:new Date().toISOString(),routineId:r.id,routineName:r.name,planDate:ov&&!ov.rest&&ov.routineId===rid?k:null,entries:[]};
  const ph=phase();const ramp=ph==="ramp",deload=ph==="deload";S.draft.ramp=ramp;S.draft.deload=deload;
  r.items.forEach(it=>{const n=effSets(it,ph);if(n&&exById(it.exId))S.draft.entries.push(makeEntry(it.exId,it.opts,{sets:n,lo:it.lo,hi:it.hi,rest:it.rest,tip:it.tip||"",ramp,deload}));});
  saveDraft();
}
function nextRoutine(){
  const rs=routines();if(!rs.length)return null;
  const last=S.workouts.filter(w=>w.routineId).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!last)return rs[0];const i=rs.findIndex(r=>r.id===last.routineId);return rs[(i+1)%rs.length];

const BIG_LOWER=["squat","legpress","rdl","deadlift","hipthrust","calf"];
function incLb(ex){const big=BIG_LOWER.includes(ex.id);return unit()==="kg"?(big?5:2.5)*LB_PER_KG:(big?10:5);}
/* Double progression coach: stay at a weight until every working set reaches the top of the rep range, then go up. */
function coach(en){
  const ex=exById(en.exId);const f=flags(ex,en.opts);const t=en.target||{sets:3,lo:S.settings.lo,hi:S.settings.hi};
  const prevAll=sessionsFor(en.vk);const prev=prevAll.filter(p=>!p.deload);const last=prev[prev.length-1]||prevAll[prevAll.length-1];
  const range=`${t.lo}–${t.hi}${f.time?" "+TU(f).w:" reps"}`;
  if(!last)return{w:null,r:t.lo,state:"new",msg:t.ramp&&!f.time?`Ramp-up: pick a weight where you can hit ${t.lo}–${t.hi} reps and still have 2–3 more in the tank. Start light; your strength will come back fast.`:f.mins?`First time: go at a pace you can keep for ${t.lo}–${t.hi} minutes. You should be breathing harder but still able to talk.`:f.time?`First time: hold as long as you can with good form.`:`First time: pick a weight you can lift for ${range} while stopping 1–2 reps short of failure.`};
  const reps=last.sets.map(s=>s.r);const lastTxt=setsSummary(last.sets,f);
  if(t.deload){const w=f.assist?last.minW:(last.top||null);return{w,r:t.lo,state:"deload",msg:`Recovery week: ${w?"use "+fmtW(w)+" (same as last time), ":""}do half the usual sets and stop 3–4 reps short of failure. Your muscles recover and you come back stronger next week.`};}
  if(f.time||(f.bw&&!last.top)){
    const hit=reps.every(r=>r>=t.hi);
    return{w:null,r:hit?t.hi:Math.max(...reps),state:hit?"up":"hold",msg:hit?`You hit ${t.hi}+ on every set last time (${lastTxt}). Make it harder: add weight, slow down the lowering, or pause at the hardest point.`:`Last time: ${lastTxt}. Try to add a rep to each set.`};
  }
  const work=last.sets.filter(s=>(s.w||0)===last.top);const inc=incLb(ex);
  if(f.assist){const ws=last.sets.filter(s=>(s.w||0)===last.minW);const hit=ws.length>=Math.min(t.sets,last.sets.length)&&ws.every(s=>s.r>=t.hi);
    const nw=Math.max(0,last.minW-inc);
    return hit?{w:nw,r:t.lo,state:"up",msg:`You hit ${t.hi} reps on every set with ${fmtW(last.minW)} of assist. Drop the assist to ${fmtW(nw)} and aim for ${t.lo}+.`}
      :{w:last.minW,r:null,state:"hold",msg:`Stay at ${fmtW(last.minW)} assist and add a rep or two. Last time: ${lastTxt}.`};}
  const hit=work.length>=Math.min(t.sets,last.sets.length)&&work.every(s=>s.r>=t.hi);
  if(hit){const nw=last.top+inc;return{w:nw,r:t.lo,state:"up",msg:`You hit ${t.hi} reps on every set at ${fmtW(last.top)}. Go up to ${fmtW(nw)} and aim for ${t.lo}+ reps per set.`};}
  if(work.some(s=>s.r<t.lo)&&work.every(s=>s.r<t.lo))return{w:Math.max(0,last.top-inc),r:t.lo,state:"down",msg:`Every set at ${fmtW(last.top)} was under ${t.lo} reps. Drop to ${fmtW(Math.max(0,last.top-inc))} so you're working in the ${range} range.`};
  return{w:last.top,r:null,state:"hold",msg:`Stay at ${fmtW(last.top)} and beat last time by a rep or two (${lastTxt}). Go up once every set reaches ${t.hi}.`};
}
/* ghost numbers = exactly what you logged last time for this set (weight, reps, difficulty) */
function ghost(entry,i){

}

function chartSVG(pts,yUnit){

  const line=pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${yv(p.y).toFixed(1)}`).join("");
  const area=line+`L${xs(pts.length-1)},${H-pb}L${xs(0)},${H-pb}Z`;
  const lbl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const xl=lbl.map(i=>`<text x="${xs(i)}" y="${H-12}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="20" fill="var(--muted)">${esc(pts[i].label)}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${xs(i)}" cy="${yv(p.y)}" r="${i===pts.length-1?5.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("");
  const lp=pts[pts.length-1];

/* ---------- gauge ---------- */
function gaugeSVG(val,goal,label,unitTxt){
  const pct=goal?Math.min(1,val/goal):0;const L=Math.PI*80;
  const col=val>goal?"var(--bad)":pct>=0.75?"var(--warn)":"var(--good)";
  const left=goal-val;
  return `<svg viewBox="0 0 200 118" class="gauge" role="img" aria-label="${label}: ${r1(val)} of ${goal} ${unitTxt}">
   <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--raised)" stroke-width="16" stroke-linecap="round"/>
   <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(pct*L).toFixed(1)} ${L.toFixed(1)}"/>
   <text x="100" y="80" text-anchor="middle" font-family="var(--display)" font-size="40" font-weight="700" fill="var(--text)">${left>=0?r1(left):"+"+r1(-left)}</text>
   <text x="100" y="104" text-anchor="middle" font-size="12" fill="var(--muted)">${left>=0?unitTxt+" left":unitTxt+" over"}</text>
   <text x="20" y="117" text-anchor="middle" font-size="10" fill="var(--muted)">0</text><text x="180" y="117" text-anchor="middle" font-size="10" fill="var(--muted)">${goal}</text></svg>`;
}
function meter(label,val,goal,kind,unitTxt){
  // kind: "limit" (stay under), "target" (reach it)
  const pct=goal?Math.min(100,val/goal*100):0;
  const col=kind==="limit"?(val>goal?"var(--bad)":pct>=75?"var(--warn)":"var(--good)"):(pct>=90?"var(--good)":"var(--accent)");
  const fm=x=>goal>=50?Math.round(x).toLocaleString():r1(x);
  const txt=kind==="limit"?(val>goal?`${fm(val-goal)} over`:`${fm(goal-val)} left`):(val>=goal?"goal hit":`${fm(goal-val)} to go`);
  return `<div class="meter"><div class="mrow"><span>${label}</span><span class="num">${Math.round(val).toLocaleString()} / ${goal.toLocaleString()}${unitTxt} · <b style="color:${col}">${txt}</b></span></div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}

function healthResult(r){
  if(!r.n){toast("Nothing found in that text. Run the Shortcut, then try again.");return;}
  const bits=[];if(r.weights)bits.push(`${r.weights} weigh-in${r.weights===1?"":"s"}`);if(r.actDays)bits.push(`${r.actDays} day${r.actDays===1?"":"s"} of activity`);
  const tt=r.today&&r.today.steps!=null?` Today: ${r.today.steps.toLocaleString()} steps.`:r.last?` Latest weight: ${r.last.w} lb.`:"";
  closeSheet();toast(`Synced ${bits.join(" and ")}.${tt}`);render();
}
/* ---------- activity (steps, miles, calories burned) ---------- */
function stepsPerMile(){const h=fg().height||69;return Math.round(63360/(h*0.414));}
function curWeight(){const bw=(S.bw||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));return bw.length?bw[bw.length-1].w:200;}
function actOf(k){const a=day(k).act||{};if(a.steps==null&&a.mi==null&&a.kcal==null)return null;
  const mi=a.mi!=null?a.mi:(a.steps!=null?a.steps/stepsPerMile():0);
  // estimate when the watch didn't supply active calories: ~0.3 kcal per lb of bodyweight per mile walked (above resting)
  const kcal=a.kcal!=null?a.kcal:Math.round(0.3*curWeight()*mi);
  return{steps:a.steps!=null?a.steps:Math.round(mi*stepsPerMile()),mi,kcal,kcalEst:a.kcal==null,src:a.src||"manual"};}
function actAvg(n,fromK){const out=[];for(let i=0;i<n;i++){const k=shiftDay(fromK||dayKey(),-i);const a=actOf(k);if(a)out.push(a);}
  if(!out.length)return null;const s=f=>out.reduce((x,a)=>x+a[f],0)/out.length;return{days:out.length,steps:s("steps"),mi:s("mi"),kcal:s("kcal")};}
function activityCard(k){
  const g=fg();const a=actOf(k);const goal=g.steps||8000;
  let h=`<div class="card"><div class="top"><div class="grow"><h3>Activity</h3><div class="sub">Steps, miles and calories from your iPhone and Apple Watch</div></div><button class="btn" data-act="f_health">Sync</button><button class="btn" data-act="f_actEdit">Edit</button></div>`;
  if(!a)h+=`<div class="sub">No activity for this day yet. Tap <b>Sync</b> to pull it from Apple Health, or <b>Edit</b> to type it in.</div>`;
  else{const pct=Math.min(100,a.steps/goal*100);
    h+=`<div class="kv"><div class="stat"><div class="v num">${a.steps.toLocaleString()}</div><div class="k">Steps (goal ${goal.toLocaleString()})</div></div><div class="stat"><div class="v num">${r1(a.mi)}</div><div class="k">Miles walked / run</div></div>
      <div class="stat"><div class="v num">${a.kcal.toLocaleString()}</div><div class="k">Active calories burned${a.kcalEst?" (estimate)":""}</div></div><div class="stat"><div class="v num">${Math.round(pct)}%</div><div class="k">Of step goal</div></div></div>
      <div class="bar"><i style="width:${pct}%;background:${pct>=100?"var(--good)":"var(--accent)"}"></i></div>`;
    if(a.kcalEst)h+=`<div class="sub">Calories are estimated from distance and your weight. Syncing Active Energy from your Apple Watch is more accurate.</div>`;}
  // last 7 days mini bars
  const ks=[];for(let i=6;i>=0;i--)ks.push(shiftDay(k,-i));const vals=ks.map(x=>(actOf(x)||{}).steps||0);const mx=Math.max(goal,...vals);
  if(vals.some(v=>v>0)){h+=`<div class="wk">${ks.map((x,i)=>`<div class="wkc"><div class="wkb"><i style="height:${vals[i]/mx*100}%;background:${vals[i]>=goal?"var(--good)":"var(--accent)"}"></i><span class="wkg" style="bottom:${goal/mx*100}%"></span></div><span>${fmtDate(x+"T12:00:00",{weekday:"narrow"})}</span></div>`).join("")}</div>`;
    const av=actAvg(7,k);if(av)h+=`<div class="sub num">7-day average: ${Math.round(av.steps).toLocaleString()} steps · ${r1(av.mi)} mi · ${Math.round(av.kcal)} active cal per day</div>`;}
  return h+`</div>`;
}
function actEditSheet(){const k=V.fday||dayKey();const a=day(k).act||{};
  sheet(`<h2>Activity for ${k===dayKey()?"today":fmtDate(k+"T12:00:00",{weekday:"short",month:"short",day:"numeric"})}</h2><div class="sub">Type numbers from the Health or Fitness app. Leave a box empty and the app estimates it from your steps.</div>
   <div class="kv"><div class="field"><label class="lbl" for="a_steps">Steps</label><input type="number" inputmode="numeric" id="a_steps" value="${a.steps??""}"></div>
   <div class="field"><label class="lbl" for="a_mi">Miles</label><input type="number" inputmode="decimal" id="a_mi" value="${a.mi??""}"></div>
   <div class="field"><label class="lbl" for="a_kcal">Active calories</label><input type="number" inputmode="numeric" id="a_kcal" value="${a.kcal??""}"></div>
   <div class="field"><label class="lbl" for="a_goal">Daily step goal</label><input type="number" inputmode="numeric" id="a_goal" value="${fg().steps||8000}"></div></div>
   <div class="btns"><button class="btn primary" data-act="f_actSave">Save</button><button class="btn" data-act="closeSheetBtn">Cancel</button></div>`);}

const MOODS=[[1,"Rough"],[2,"Low"],[3,"OK"],[4,"Good"],[5,"Great"]];
const PROMPTS=["What went well today?","What's one thing you'd do differently tomorrow?","How did your body feel in the gym?","Any cravings today? What triggered them?","What are you grateful for today?","What's on your mind that you want to get out of your head?","What's one small win from today?"];
function vToday(){
  const k=V.tday||dayKey();const d=day(k);const g=fg();const t=totals(k);const a=actOf(k);
  const doneW=S.workouts.filter(w=>dayKey(new Date(w.date))===k);const nx=nextRoutine();
  const bw=(S.bw||[]).slice().sort((x,y)=>x.d.localeCompare(y.d));const lw=bw[bw.length-1];const wk=bw.filter(x=>x.d<=shiftDay(k,-7)).pop();
  const tile=(act,v,label,sub,state)=>`<button class="tile ${state||""}" data-act="${act}"><span class="v num">${v}</span><span class="k">${label}</span>${sub?`<span class="k">${sub}</span>`:""}</button>`;
  const nm=S.profile&&S.profile.name;const hr=new Date().getHours();
  let h=dayNav(k===dayKey()?`${hr<12?"Good morning":hr<17?"Good afternoon":"Good evening"}${nm?", "+nm:""} · ${new Date().toLocaleDateString([], {month:"long",day:"numeric"})}`:"");
  h+=`<div class="tiles">`+
    tile("t_goTrain",doneW.length?"Done":S.draft?"Going":(nx?esc(nx.name.split(" · ")[0]):"–"),"Workout",doneW.length?esc(doneW[0].title||""):S.draft?"In progress":"Up next",doneW.length?"good":"")+
    tile("t_goFood",r1(Math.max(0,g.net-t.net))+" g","Net carbs left",`${r1(t.net)} of ${g.net} used`,t.net>g.net?"bad":t.net>=g.net*0.75?"warn":"good")+
    tile("t_goFood",a?a.steps.toLocaleString():"–","Steps",a?`${r1(a.mi)} mi · ${a.kcal} cal`:"Sync on Food tab",a&&a.steps>=(g.steps||8000)?"good":"")+
    (()=>{const kt=kNorm((day(k).keto||{}).status);const kd=ketoData();let st=0;for(let i=kd.length-1;i>=0&&kd[i].in;i--)st++;
      return tile("t_goFood",kt==="high"?"High":kt==="light"?"Slight":kt==="out"?"Out":"–","Ketosis",kt?(st?`${st} test${st===1?"":"s"} in a row`:"see what knocked you out"):"Not tested today",kt==="high"?"good":kt==="light"?"klight":kt==="out"?"bad":"");})()+
    (()=>{const c=dayCost(k);return tile("t_goMoney",c.n?$$(c.tot):"–","Food cost",c.n?`${c.n} item${c.n===1?"":"s"} priced${c.missing?` · ${c.missing} not`:""}`:(t.cal?"Add prices":"Nothing logged"),"");})()+
    tile("t_goFood",Math.round(t.p)+" g","Protein",`goal ${g.p} g`,t.p>=g.p*0.9?"good":"")+
    tile("t_goFood",(d.water||0)+" oz","Water",`goal ${g.water} oz`,(d.water||0)>=g.water?"good":"")+
    tile("t_goFood",lw?r1(lw.w):"–","Weight (lb)",lw&&wk?`${lw.w-wk.w<=0?"−":"+"}${r1(Math.abs(lw.w-wk.w))} this week`:lw?fmtDate(lw.d+"T12:00:00",{month:"short",day:"numeric"}):"Log on Food tab",lw&&wk&&lw.w<wk.w?"good":"")+
  `</div>`;
  if(k===dayKey())h+=backupNudge();

function journalCard(k){
  const j=day(k).journal||{};const n=Math.floor(Date.now()/864e5);
  return `<div class="card"><div class="top"><div class="grow"><h3>Journal</h3><div class="sub">${esc(PROMPTS[n%PROMPTS.length])}</div></div><span class="sub" id="jSaved">${j.updatedAt?"Saved":""}</span></div>
   <div class="q"><label>Mood</label><div class="chips">${MOODS.map(([v,l])=>`<button class="chip" data-act="t_mood" data-v="${v}" aria-pressed="${j.mood===v}">${l}</button>`).join("")}</div></div>
   <div class="q"><label>Energy</label><div class="chips">${MOODS.map(([v,l])=>`<button class="chip" data-act="t_energy" data-v="${v}" aria-pressed="${j.energy===v}">${["Drained","Low","OK","Good","High"][v-1]}</button>`).join("")}</div></div>
   <textarea id="jText" placeholder="Write anything: how you feel, what you ate, what's on your mind…" style="min-height:140px">${esc(j.text||"")}</textarea></div>`;
}
function pastJournal(){
  const ks=Object.keys(S.days||{}).filter(k=>k<dayKey()&&S.days[k].journal&&(S.days[k].journal.text||S.days[k].journal.mood)).sort().reverse();
  if(!ks.length)return"";
  const q=(V.jq||"").toLowerCase();const list=ks.filter(k=>!q||(S.days[k].journal.text||"").toLowerCase().includes(q));
  return `<details class="fold" id="jFold" ${V.jOpen||q?"open":""}><summary>Past entries (${ks.length})<span class="chev">⌄</span></summary><div class="foldbody">
    <input type="search" id="jq" placeholder="Search your journal" value="${esc(V.jq||"")}" aria-label="Search journal">
    ${list.slice(0,60).map(k=>{const j=S.days[k].journal;const m=MOODS.find(x=>x[0]===j.mood);
      return `<div class="jentry"><div class="top"><b>${fmtDate(k+"T12:00:00",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}</b>${m?`<span class="pill">${m[1]}</span>`:""}</div>${j.text?`<div class="jtext">${esc(j.text)}</div>`:""}</div>`;}).join("")||`<div class="empty">No entries match.</div>`}
  </div></details>`;
}

function cleanItem(line){return line.replace(/^\s*(?:[-*•◦▪︎·]|\[[ xX✓]?\]|[☐☑✅✔︎✓]|\d+[.)])\s*/,"").replace(/\s+/g," ").trim();}
function parseNote(txt){
  let lines=String(txt||"").split(/\r?\n/).map(l=>({raw:l,t:cleanItem(l)})).filter(l=>l.t);
  if(lines.length>1&&/shopping|grocer|list/i.test(lines[0].t)&&lines[0].t.length<40)lines=lines.slice(1);
  return lines.map(l=>({text:l.t,done:/^\s*(?:\[[xX✓]\]|[☑✅✔︎✓]|-\s*\[[xX]\])/.test(l.raw)}));
}
function importNote(txt){
  const parsed=parseNote(txt);if(!parsed.length)return 0;const sh=shop();
  const keepApp=sh.items.filter(i=>i.src==="app"&&!i.sent&&!parsed.some(p=>p.text.toLowerCase()===i.text.toLowerCase()));
  const prevDone=new Set(sh.items.filter(i=>i.done).map(i=>i.text.toLowerCase()));
  sh.items=[...parsed.map(p=>({id:uidGen(),text:p.text,done:p.done||prevDone.has(p.text.toLowerCase()),src:"note"})),...keepApp];
  sh.note=parsed.map(p=>p.text);sh.lastNote=Date.now();saveShop();return parsed.length;
}

/* ============================================================
   FACE ID LOCK (installed app): passkey with user verification
   ============================================================ */
let LOCKED=false,hiddenAt=0;
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
async function sha(s){return b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)));}
function lockSupported(){return !!(window.REP_PWA&&window.PublicKeyCredential&&window.isSecureContext&&navigator.credentials);}
function lockOn(){return !!(S.settings.lock&&S.settings.lock.cred);}
async function faceAuth(){
  const c=await navigator.credentials.get({publicKey:{challenge:rand(32),allowCredentials:[{type:"public-key",id:unb64(S.settings.lock.cred)}],userVerification:"required",timeout:60000}});
  return !!c;
}
async function setupLock(){
  try{
    if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())){toast("Face ID / Touch ID isn't set up on this device.");return;}
    const c=await navigator.credentials.create({publicKey:{challenge:rand(32),rp:{name:"Rep Ledger",id:location.hostname},user:{id:rand(16),name:"Rep Ledger lock",displayName:"Rep Ledger"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000}});
    if(!c)return;
    const code=Array.from(rand(9)).map(x=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[x%31]).join("").replace(/(.{3})(?=.)/g,"$1-");
    S.settings.lock={cred:b64(c.rawId),rc:await sha(code),at:Date.now()};saveProfile();
    sheet(`<h2>Face ID lock is on</h2><div class="sub">Write this recovery code down or save it in your Passwords app. It's the only way back in if Face ID ever stops working for this app. It won't be shown again.</div>
      <div class="rcode num">${code}</div><button class="btn" data-act="lk_copy" data-v="${code}">Copy code</button><button class="btn primary" data-act="closeSheetBtn">I saved it</button>`);
    render();
  }catch(e){toast("Face ID setup was cancelled.");}
}
function renderLock(){
  $("#nav").innerHTML="";$("#timerSlot").innerHTML="";
  $("#app").innerHTML=`<div class="lockscr"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    <h1>Rep Ledger is locked</h1><div class="sub">Your workouts, food log and journal are private.</div>
    <button class="btn primary block big" data-act="lk_unlock">Unlock with Face ID</button>
    <details class="fold" style="width:100%"><summary style="font-size:16px">Can't use Face ID?<span class="chev">⌄</span></summary><div class="foldbody">
      <div class="sub">If Face ID fails, iPhone offers your passcode in the same prompt. If that doesn't work, enter your recovery code.</div>
      <input type="text" id="rcIn" placeholder="XXX-XXX-XXX" autocapitalize="characters" autocomplete="off"><button class="btn block" data-act="lk_code">Unlock with recovery code</button></div></details></div>`;
}
async function tryUnlock(){try{if(await faceAuth()){LOCKED=false;render();}}catch(e){toast("Face ID didn't unlock. Try again.");}}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act^='lk_']");if(!b)return;const a=b.dataset.act;
  if(a==="lk_unlock")tryUnlock();
  if(a==="lk_code"){const v=($("#rcIn").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{3})(?=.)/g,"$1-");if(S.settings.lock&&(await sha(v))===S.settings.lock.rc){LOCKED=false;S.settings.lock=null;saveProfile();render();toast("Unlocked. Face ID lock was turned off. Turn it on again in Settings.");}else toast("That recovery code doesn't match.");}
  if(a==="lk_setup")setupLock();
  if(a==="lk_off"){try{if(await faceAuth()){S.settings.lock=null;saveProfile();render();toast("Face ID lock turned off");}}catch(e){toast("Face ID didn't confirm, so the lock stays on.");}}
  if(a==="lk_copy"){try{await navigator.clipboard.writeText(b.dataset.v);toast("Recovery code copied");}catch(e){}}
});

const OB_STEPS=["name","body","goal","diet","activity","schedule","limits","plan"];
function obDefaults(){

  const existing=S.workouts.length||Object.keys(S.days||{}).length;
  return{name:P.name||"",sex:P.sex||"",age:P.age||"",ft:P.ft||(fgv.height?Math.floor(fgv.height/12):""),inch:P.inch??(fgv.height?fgv.height%12:""),weight:P.weight||lw||"",
    goal:P.goal||(existing?"lose":""),goalW:P.goalW||(existing?S.settings.goalW:"")||"",diet:P.diet||(existing?"strict":""),activity:P.activity||"",exp:P.exp||"",returning:P.returning||"",
    days:P.days||(existing?4:""),mins:P.mins||"",place:P.place||"",limits:P.limits||[],focus:P.focus||[],keep:existing&&S.routines?"keep":"new"};

function startOnboarding(){V.ob={step:0,a:obDefaults()};V.tab=null;go("welcome");}
function obCalc(a){
  const h=(+a.ft||0)*12+(+a.inch||0)||66,w=+a.weight||170,age=+a.age||35;const kg=w/LB_PER_KG,cm=h*2.54;
  const bmr=10*kg+6.25*cm-5*age+(a.sex==="m"?5:a.sex==="f"?-161:-78);
  const actM={sit:1.2,light:1.375,feet:1.5,labor:1.65}[a.activity]||1.3;const tdee=Math.round(bmr*actM+(+a.days||3)*45);
  let cal=tdee;if(a.goal==="lose")cal=tdee-Math.min(600,Math.round(tdee*0.22));else if(a.goal==="recomp")cal=tdee-300;else if(a.goal==="build")cal=tdee+250;
  const floor=Math.max(a.sex==="m"?1500:1200,Math.round(bmr*0.95));cal=Math.max(cal,floor);cal=Math.round(cal/50)*50;
  const gw=+a.goalW||w;const pBase=a.goal==="build"?w:Math.min(w,Math.max(gw,w*0.8));const p=Math.round(pBase*(a.goal==="build"?0.9:0.85)/5)*5;
  const net={strict:20,moderate:30,low:50,none:130}[a.diet]||30;const sug={strict:10,moderate:15,low:25,none:a.sex==="m"?36:25}[a.diet]||25;
  const weekly=(tdee-cal)*7/3500;const wk=a.goal==="lose"&&weekly>0.1&&w>gw?Math.ceil((w-gw)/Math.min(weekly,w*0.01)):null;
  return{h,w,bmr:Math.round(bmr),tdee,cal,p,net,sug,water:Math.max(64,Math.round(w/2/8)*8),steps:a.activity==="sit"?7000:8000,weekly:Math.round(weekly*10)/10,weeks:wk,bmi:w/(h*h)*703};
}
/* program builder: pick exercises by movement slot, respecting equipment and limitations */
function buildProgram(a){
  const home=a.place==="home",L=new Set(a.limits||[]),beg=a.exp==="new",F=new Set(a.focus||[]);
  const lose=a.goal==="lose"||a.goal==="recomp",build=a.goal==="build";
  const C=(ex,opts,tip)=>({ex,opts,tip:tip||""});
  const slot={
    squat: home?C("squat",{equip:"goblet"}):L.has("knees")?C("legpress",{equip:"machine",feet:"high"},"Feet high and wide on the platform is easier on knees."):beg?C("legpress",{equip:"machine",feet:"std"}):C("squat",{equip:"smith",style:"back"}),
    hinge: L.has("back")?C("legcurl",{type:"seated"}):home?C("rdl",{equip:"db"}):C("rdl",{equip:beg?"db":"bb"},"Push hips back, slight knee bend, flat back."),
    glute: home?C("hipthrust",{equip:"db"}):C("hipthrust",{equip:"smith"},"Pause and squeeze at the top."),
    lunge: L.has("knees")?(home?C("hipthrust",{equip:"db"}):C("glutekick",{equip:"cable"})):C("lunge",{equip:home?"db":"db",style:"split"}),
    legcurl: home?C("rdl",{equip:"db"}):C("legcurl",{type:"seated"}),
    legext: home?C("stepup",{}):L.has("knees")?C("abductor",{}):C("legext",{legs:"both"}),
    abd: home?C("glutekick",{equip:"cable"}):C("abductor",{}),
    pushH: home?C("bench",{equip:"db",angle:"flat"}):(L.has("shoulders")||beg)?C("chestpress",{type:"seated"}):C("bench",{equip:"db",angle:"flat"}),
    pushI: home?C("pushup",{style:"incline"}):L.has("shoulders")?C("fly",{equip:"machine"}):C("bench",{equip:"db",angle:"incline"}),
    pullV: home?C("dbrow",{style:"single"}):C("pulldown",{equip:"machine",grip:"neutral"}),
    pullH: home?C("dbrow",{style:"chest"}):C("row",{equip:"machine",grip:"neutral"}),
    press: home?C("spress",{equip:"db",pos:"seated"}):L.has("shoulders")?C("lateral",{equip:"db"},"Light weight, raise only to shoulder height."):C("spress",{equip:"machine"}),
    lat: C("lateral",{equip:"db"}),
    rear: home?C("reardelt",{equip:"db"}):C("reardelt",{equip:"machine"}),
    face: home?C("reardelt",{equip:"db"}):C("facepull",{}),
    bi: C("curl",{equip:"db",style:"alt"}),
    tri: home?C("ohext",{equip:"db",pos:"seated"}):C("pushdown",{equip:"cable",attach:"rope"}),
    core: home||L.has("back")?C("plank",{style:"front"}):C("abcrunch",{}),
    core2: home?C("russian",{equip:"bw"}):C("kneeraise",{equip:"captain"}),
    calf: home?C("calf",{equip:"db"}):C("calf",{equip:"standing"}),
    cardio: home?C("walk",{},"Brisk pace. Counts toward your steps too."):C("treadmill",{},"Incline walk, e.g. 3.0 mph at 8–12% incline. Great for fat loss and easy on joints.")
  };
  const big=new Set(["squat","hinge","glute","pushH","pullV","pullH","press"]);
  const scheme=k=>{if(k==="cardio")return[1,lose?15:10,lose?25:15,0];if(k==="core"||k==="core2")return[beg?2:3,12,15,45];
    if(big.has(k))return build?[beg?3:4,6,10,150]:[3,8,12,lose?90:120];return[beg?2:3,lose?12:10,15,lose?45:60];};
  let days;const n=+a.days||3;
  const UA=["pushH","pullV","press","pullH","lat","tri","bi","core"],LA=["squat","hinge","legext","legcurl","calf","core2"],
        UB=["face","pullH","pushI","press","pullV","rear","bi","tri"],LB=["glute","lunge","legcurl","abd","calf","core"],
        FA=["squat","pushH","pullV","hinge","lat","core"],FB=["glute","pushI","pullH","lunge","rear","core2","bi","tri"],FC=["legext","press","pullV","legcurl","pushH","core","calf"];
  if(n<=2)days=[["Full Body A",FA],["Full Body B",FB]];
  else if(n===3)days=[["Full Body A",FA],["Full Body B",FB],["Full Body C",FC]];
  else if(n===4)days=[["Upper A",UA],["Lower A",LA],["Upper B",UB],["Lower B",LB]];
  else days=[["Upper A",UA],["Lower A",LA],["Full Body",FA],["Upper B",UB],["Lower B",LB]];
  // focus areas add work where asked
  days=days.map(([nm,sl])=>{sl=[...sl];const lower=/Lower|Full/.test(nm),upper=/Upper|Full/.test(nm);
    if(F.has("glutes")&&lower&&!sl.includes("glute"))sl.splice(1,0,"glute");if(F.has("glutes")&&lower&&!sl.includes("abd"))sl.push("abd");
    if(F.has("arms")&&upper){if(!sl.includes("bi"))sl.push("bi");if(!sl.includes("tri"))sl.push("tri");}
    if(F.has("core")&&!sl.includes("core2"))sl.push("core2");
    if(F.has("posture")&&upper&&!sl.includes("face"))sl.unshift("face");
    return[nm,sl];});
  const cap={30:4,45:5,60:6,75:7,90:8}[a.mins]||6;
  const prio=k=>big.has(k)||(k==="glute"&&F.has("glutes"))?0:k.startsWith("core")?2:1;
  return days.map(([nm,sl],i)=>{sl=[...new Set(sl)];const n2=cap-(lose?1:0);
    if(sl.length>n2){const keep=new Set(sl.map((k,j)=>({k,j,p:prio(k)})).sort((x,y)=>x.p-y.p||x.j-y.j).slice(0,n2).map(x=>x.k));sl=sl.filter(k=>keep.has(k));}if(lose||a.mins>=60)sl.push("cardio");

    sl.forEach(k=>{const c=slot[k];const key=c.ex+JSON.stringify(c.opts);if(seen.has(key))return;seen.add(key);const [sets,lo,hi,rest]=scheme(k);items.push([c.ex,c.opts,sets,lo,hi,rest,c.tip]);});
    return{id:"c_day"+i,name:nm,items};});

function unitPrice(e){const sz=+e.size||0;return sz>0?e.price/sz:null;}
function bestOf(item){const es=item.entries||[];const latest={};es.forEach(e=>{if(!latest[e.store]||latest[e.store].d<=e.d)latest[e.store]=e;});
  const list=Object.values(latest);const withU=list.filter(e=>unitPrice(e)!=null);
  const best=(withU.length===list.length&&withU.length?withU.sort((a,b)=>unitPrice(a)-unitPrice(b)):list.sort((a,b)=>a.price-b.price))[0];return{best,list};}

let IDBP=null;
function idbOpen(){if(IDBP)return IDBP;IDBP=new Promise(res=>{try{const r=indexedDB.open("repledger",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});return IDBP;}
async function idbGet(){const db=await idbOpen();if(!db)return null;return new Promise(res=>{try{const q=db.transaction("kv","readonly").objectStore("kv").get("state");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
let idbT=null,IDB_READY=false;
function idbSave(){if(!IDB_READY)return;clearTimeout(idbT);idbT=setTimeout(async()=>{const db=await idbOpen();if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(JSON.parse(JSON.stringify(S)),"state");}catch(e){}},300);}

   ============================================================ */
let T={end:0,iv:null,next:null,beeped:false,key:""};
let AC=null;
function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==="suspended")AC.resume();}catch(e){}}
function beep(){try{if(!AC)return;[0,0.25,0.5].forEach((d,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=k===2?1320:880;o.connect(g);g.connect(AC.destination);
  const t0=AC.currentTime+d;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);o.start(t0);o.stop(t0+0.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
let WL=null;
async function keepAwake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null;});}else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.draft)keepAwake(true);});
function ensureTicker(){clearInterval(T.iv);if(T.end||(S.draft&&S.draft.active))T.iv=setInterval(renderTimer,500);renderTimer();}
function startTimer(sec,next){sec=sec||S.settings.rest;T.next=next||null;T.beeped=false;if(!sec){T.end=0;ensureTicker();return;}T.end=Date.now()+sec*1000;T.total=sec;if(S.draft){S.draft.rest={end:T.end,next:T.next,total:sec};}ensureTicker();}
function stopRest(){T.end=0;T.next=null;if(S.draft)S.draft.rest=null;ensureTicker();}
const clock=sec=>{const a=Math.abs(sec);return(sec<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");};
function exName(e){const en=S.draft&&S.draft.entries[e];const ex=en&&exById(en.exId);return ex?ex.n:"";}
function renderTimer(){
  const slot=$("#timerSlot");const act=S.draft&&S.draft.active;
  const sc=document.getElementById("setClock");
  if(act){const sec=Math.floor((Date.now()-act.start)/1000);if(sc)sc.textContent=clock(sec);
    const key="act"+act.e+"-"+act.i;
    document.body.classList.add("timing");
    if(T.key!==key){T.key=key;slot.innerHTML=`<div class="timer live" role="timer"><span class="tl"><span class="sub">Set ${act.i+1} · ${esc(exName(act.e))}</span><span class="tv num" id="tbClock">${clock(sec)}</span></span><button class="btn primary" data-act="doneSet">Done</button></div>`;}
    else{const c=document.getElementById("tbClock");if(c)c.textContent=clock(sec);}
    return;}
  if(!T.end){if(slot.innerHTML)slot.innerHTML="";T.key="";document.body.classList.remove("timing");clearInterval(T.iv);return;}
  document.body.classList.add("timing");
  const left=Math.round((T.end-Date.now())/1000);
  if(left<=0&&!T.beeped){T.beeped=true;beep();}
  if(left<-300){stopRest();return;}
  const nx=T.next;const nxt=nx?`Next: ${nx.i===0?esc(exName(nx.e)):"set "+(nx.i+1)+(nx.e!==(V.idx)?" · "+esc(exName(nx.e)):"")}`:"Rest";
  const key="rest"+(left<=0)+(nx?nx.e+"-"+nx.i:"");
  if(T.key!==key){T.key=key;
    slot.innerHTML=`<div class="timer ${left<=0?"end":""}" role="timer"><span class="tl"><span class="sub">${left>0?"Rest":"Rest over"} · ${nxt}</span><span class="tv num" id="tbClock">${clock(left)}</span></span>${left>0?`<button class="btn" data-act="t30">+30s</button>`:""}<span class="tprog"><i id="tbProg"></i></span>${nx?`<button class="btn primary" data-act="startSet" data-e="${nx.e}" data-v="${nx.i}">Start</button>`:`<button class="btn" data-act="tskip">Close</button>`}</div>`;}
  else{const c=document.getElementById("tbClock");if(c)c.textContent=clock(left);}
  const pg=document.getElementById("tbProg");if(pg)pg.style.width=Math.max(0,Math.min(100,left/(T.total||S.settings.rest||90)*100))+"%";
}
/* ---------- guided flow ---------- */
function nextUndone(fromE){
  if(!S.draft)return null;const es=S.draft.entries;const n=es.length;
  for(let k=0;k<n;k++){const e=(fromE+k)%n;const i=es[e].sets.findIndex(x=>!x.done);if(i>=0)return{e,i};}
  return null;
}
function startSet(e,i){
  if(!S.draft)return;unlockAudio();
  S.draft.active={e,i,start:Date.now()};T.end=0;T.next=null;S.draft.rest=null;saveDraft();keepAwake(true);
  if(V.view!=="log"||V.idx!==e)go("log",{idx:e});else render();
  ensureTicker();
}
function completeSet(e,i){
  const en=S.draft.entries[e];const s=en.sets[i];const g=ghost(en,i);
  if(s.r==null&&g.r!=null)s.r=g.r;if(s.w==null&&g.w!=null)s.w=g.w;
  if(s.r==null){toast("Enter your reps first");if(V.idx===e)$("#r"+i)?.focus();return;}
  s.done=true;S.draft.active=null;T.key="";
  const iN=en.sets.findIndex(x=>!x.done);const nx=iN>=0?{e,i:iN}:nextUndone(e);saveDraft();
  if(!nx){stopRest();render();toast("Last set done! Check your numbers, then tap Finish workout.");return;}
  startTimer(en.target&&en.target.rest,nx);render();
  if(iN<0)toast(`${exName(e)} done. Rest, then tap Next when you're ready.`);
  saveDraft();
}

function finishSheet(complete){

  V.selR=null;saveWorkout(w);if(d.routineId){const st=S.settings;
    if(d.deload&&st.deloadLeft>0){st.deloadLeft--;if(!st.deloadLeft){st.sinceDeload=0;st.deloadSnooze=0;w.deloadEnded=true;}}

    case"saveCustom":{const c=V.customDraft;if(!c.n.trim())break;
      const o=[];if(c.eq.length>1)o.push({key:"equip",label:"Equipment",choices:c.eq.map(k=>{const e=CUSTOM_EQ.find(x=>x[0]===k);return k==="bw"?[k,e[1],"",{bw:true}]:[k,e[1]];})});
      if(c.angle)o.push({...ANGLE});
      const ex={id:"c_"+uidGen(),n:c.n.trim(),g:c.g,pf:c.pf.trim()||(c.eq.length===1?CUSTOM_EQ.find(x=>x[0]===c.eq[0])[1]:""),o,custom:true,bw:c.bw||(c.eq.length===1&&c.eq[0]==="bw"),time:c.time};
      S.custom.push(ex);saveProfile();toast("Exercise added");go("group",{group:ex.g});break;}
    case"rmCustom":S.custom=S.custom.filter(c=>c.id!==v);saveProfile();render();break;
    case"bkLater":S.settings.lastBackup=Date.now()-7*864e5;saveProfile();render();break;
    case"copyBackup":try{await navigator.clipboard.writeText(backupText());S.settings.lastBackup=Date.now();saveProfile();toast("Backup copied. Paste it into Notes or email to keep it safe.");}catch(e){toast("Copy was blocked by the browser");}break;
    case"dlBackup":{const fn="rep-ledger-backup-"+new Date().toISOString().slice(0,10)+".json";
      S.settings.lastBackup=Date.now();saveProfile();
      try{if(Cloud.dl){await Cloud.dl.save({filename:fn,data:backupText()});break;}
        const file=new File([backupText()],fn,{type:"application/json"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Rep Ledger backup"});}
        else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=fn;document.body.appendChild(a);a.click();a.remove();}
      }catch(e){}break;}
    case"import":{const txt=$("#importIn").value.trim();if(!txt)break;try{const d=JSON.parse(txt);if(!Array.isArray(d.workouts))throw 0;
      const have=new Set(S.workouts.map(w=>w.id));let n=0;d.workouts.forEach(w=>{if(!have.has(w.id)){saveWorkout(w);n++;}});
      (d.custom||[]).forEach(c=>{if(!S.custom.find(x=>x.id===c.id))S.custom.push(c);});
      if(d.version>=2){if(d.days)Object.keys(d.days).forEach(k=>{if(!S.days[k]||(d.days[k].updatedAt||0)>(S.days[k].updatedAt||0))S.days[k]=d.days[k];});
        if(d.bw){const mp=new Map((S.bw||[]).map(x=>[x.d,x]));d.bw.forEach(x=>{if(!mp.has(x.d))mp.set(x.d,x);});S.bw=[...mp.values()].sort((a,b)=>a.d.localeCompare(b.d));}
        ["customFoods","recentFoods","shop","profile","customProgram","money","plan","routines","lastOpts","recipes"].forEach(f=>{if(d[f]&&(!S[f]||(Array.isArray(S[f])&&!S[f].length)))S[f]=d[f];});
        if(d.settings)S.settings={...d.settings,...S.settings};}
      saveProfile();toast(`Restored ${n} workout${n===1?"":"s"}`);render();}catch(e){toast("That doesn't look like a Rep Ledger backup");}break;}
  }
});
function addToRoutine(exId,opts){const pf=V.pickFor||"";const r=pf.startsWith("plan:")?ensurePlan(pf.slice(5)):routines().find(x=>x.id===pf);if(pf.startsWith("plan:"))V.planDate=pf.slice(5);V.pickFor=null;
  if(r){r.items.push({exId,opts,sets:3,lo:S.settings.lo,hi:S.settings.hi,rest:90});S.lastOpts[exId]=opts;saveProfile();toast("Added to "+r.name);}
  go("routine",{rid:r&&!V.planDate?r.id:V.rid});}
function vPickGroup(){return header("Add to "+esc((((V.pickFor||"").startsWith("plan:")?ensurePlan(V.pickFor.slice(5)):routines().find(x=>x.id===V.pickFor))||{}).name||"workout"),"Pick a muscle group","pickCancel")+`<div class="grid">`+GROUPS.map(g=>`<button class="gbtn" data-act="group" data-v="${g.id}"><b>${g.name}</b><span>${g.blurb}</span></button>`).join("")+`</div>`;}
function backupText(){return JSON.stringify({app:"rep-ledger",version:2,exported:new Date().toISOString(),settings:S.settings,custom:S.custom,workouts:S.workouts,days:S.days,bw:S.bw,routines:S.routines,customFoods:S.customFoods,recentFoods:S.recentFoods,shop:S.shop,profile:S.profile,customProgram:S.customProgram,money:S.money,plan:S.plan,recipes:S.recipes,lastOpts:S.lastOpts});}

document.addEventListener("toggle",ev=>{if(ev.target.id==="addFold")V.addOpen=ev.target.open;},true);
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="q"){V.q=t.value;const pos=t.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}return;}
  if(t.dataset.field&&S.draft){const en=S.draft.entries[V.idx];const s=en.sets[+t.dataset.i];
    if(t.dataset.field==="w")s.w=fromDisp(t.value);else{const n=parseInt(t.value,10);s.r=isNaN(n)?null:n;t.className=repClass(en,s.r);}saveDraft();return;}
  if(t.dataset.rf){const r=edTarget();const n=parseInt(t.value,10);if(!isNaN(n)&&n>=0){r.items[+t.dataset.ri][t.dataset.rf]=n;saveProfile();}return;}
  if(t.dataset.rname){const r=edTarget();r.name=t.value;saveProfile();return;}
  if(t.dataset.goalw){const w=fromDisp(t.value);if(w){S.settings.goalW=Math.round(w*10)/10;saveProfile();}return;}
  if(t.dataset.setting){const n=parseInt(t.value,10);if(!isNaN(n)&&n>=0){S.settings[t.dataset.setting]=n;saveProfile();}return;}
  if(t.dataset.cf){V.customDraft[t.dataset.cf]=t.value;const s=$("#cSave");if(s)s.disabled=!V.customDraft.n.trim();}
});

/* ============================================================
   BOOT
   ============================================================ */
loadLocal();
const LOADED_AT=S.savedAt||0;
if(migrate())saveProfile();
if(seedRecipes())saveProfile();
function dropStaleDraft(){if(S.draft&&!S.draft.entries.some(e=>setsOf(e).length)&&Date.now()-new Date(S.draft.start)>12*3600e3){S.draft=null;saveDraft();return true;}return false;}
dropStaleDraft();
if(lockOn()&&lockSupported())LOCKED=true;
{const hm=S.settings.home||"food";V.tab=hm;V.view={food:"food",today:"today",train:"home"}[hm]||"food";}
if(!S.profile&&!S.workouts.length&&!Object.keys(S.days||{}).length&&!(S.bw||[]).length&&!S.draft){V.ob={step:0,a:obDefaults()};V.tab=null;V.view="welcome";}
if(S.draft&&S.draft.rest&&S.draft.rest.end>Date.now()-300000){T.total=S.draft.rest.total||S.settings.rest;T.end=S.draft.rest.end;T.next=S.draft.rest.next;T.beeped=T.end<Date.now();}
render();ensureTicker();
idbRestore();
if(S.settings.appVer&&S.settings.appVer!==APP_VERSION&&(S.workouts.length||Object.keys(S.days||{}).length))setTimeout(()=>toast("App updated. All your workouts, food log and goals are still here."),600);
if(S.settings.appVer!==APP_VERSION){S.settings.appVer=APP_VERSION;saveLocal();}
initCloud();
(async()=>{try{let i=0;while(!(window.claude&&window.claude.use)&&i<30){await new Promise(r=>setTimeout(r,100));i++;}
  if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){Cloud.dl=dl;if(V.view==="settings")render();}}}catch(e){}})();
</script>
